<title>Sky Bike Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-shaped stage; the WebGL world fills it, chrome-and-cobalt HUD layers float on top. */
:root{
  --bg:#040a19; --navy:#0b1f45; --navy2:#12306a; --deep:#071634;
  --cobalt:#1e6bff; --cyan:#38d6ff; --chrome:#eaf3ff; --steel:#7f97bd;
  --gold:#ffc83a; --red:#ff3b4f; --green:#2fd36f; --text:#eaf3ff; --muted:#9db8dd;
  --f-display:'Russo One','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Rajdhani','Segoe UI',Roboto,system-ui,sans-serif;
  --chamfer:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;aspect-ratio:9/18;max-width:100%;margin:0 auto;overflow:hidden;
  container-type:size;background:radial-gradient(120% 80% at 50% 20%,#14306a,#040a19);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;z-index:5}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.chrome-text{background:linear-gradient(180deg,#fff 0%,#e3ecf8 42%,#7d93b5 50%,#f2f7ff 66%,#a8bad6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- loading ---------- */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6cqw;
  background:radial-gradient(90% 60% at 50% 40%,#1b4ea8 0%,#0a1d45 55%,#040a19 100%);z-index:40}
.bar{width:62cqw;height:2.6cqw;border-radius:2cqw;background:#0a1a3a;border:.4cqw solid #5f86c4;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1e6bff,#38d6ff);box-shadow:0 0 2cqw #38d6ff;transition:width .2s}
.loadtxt{font:600 3.4cqw var(--f-body);letter-spacing:.4em;color:var(--muted)}

/* ---------- logo ---------- */
.logo{position:relative;text-align:center;transform:rotate(-5deg);line-height:.86;pointer-events:none}
.logo::before{content:"";position:absolute;left:-4cqw;right:-4cqw;top:38%;height:30%;
  background:linear-gradient(90deg,transparent,rgba(30,107,255,.85) 20%,rgba(56,214,255,.9) 50%,rgba(30,107,255,.85) 80%,transparent);
  clip-path:polygon(0 50%,12% 0,100% 20%,88% 100%);filter:blur(.3cqw);opacity:.75}
.logo .l1,.logo .l2,.logo .l3{position:relative;display:block;font-family:var(--f-display);font-style:italic;letter-spacing:.02em;
  -webkit-text-stroke:.5cqw #0a2a6e;paint-order:stroke fill;
  filter:drop-shadow(0 .7cqw 0 #061a48) drop-shadow(0 0 2.6cqw rgba(56,214,255,.55))}
.logo .l1{font-size:13cqw}
.logo .l2{font-size:19cqw}
.logo .l3{font-size:12cqw;background:linear-gradient(180deg,#f2fdff 0%,#8fe8ff 40%,#1e9bff 62%,#1253d6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:22cqw}
.logo .tag{position:relative;display:block;margin-top:2cqw;font:700 3.1cqw var(--f-body);letter-spacing:.42em;color:#d6ecff;text-shadow:0 0 2cqw #1e6bff}

/* ---------- icon buttons ---------- */
.ib{position:relative;width:17cqw;filter:drop-shadow(0 0 1.3cqw rgba(56,214,255,.42)) drop-shadow(0 .8cqw .7cqw rgba(0,0,0,.5))}
.ib>button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;aspect-ratio:1/1.04;padding:.55cqw;clip-path:var(--chamfer);
  background:linear-gradient(160deg,#f7fbff 0%,#7f97bd 34%,#eef5ff 54%,#47628c 100%);transition:transform .12s}
.ib>button:active{transform:scale(.93)}
.ib>button:focus-visible{outline:none;background:linear-gradient(160deg,#fff,#38d6ff 50%,#fff)}
.ib .face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;height:100%;clip-path:var(--chamfer);
  background:radial-gradient(120% 85% at 50% 0%,#2c68cc 0%,#0f2c66 55%,#081a3d 100%);box-shadow:inset 0 0 0 .35cqw rgba(56,214,255,.45)}
.ib svg{width:52%;height:auto;filter:drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.45))}
.ib .lbl{font:2.55cqw var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 .3cqw 0 #061436}
.ib.gold>button{background:linear-gradient(160deg,#fff5cf,#c58a17 40%,#ffe9a3 60%,#8a5a0a)}
.ib.gold .face{background:radial-gradient(120% 85% at 50% 0%,#3b2a72 0%,#1d1440 60%,#0f0a24 100%);box-shadow:inset 0 0 0 .35cqw rgba(255,200,58,.5)}
.badge{position:absolute;top:-1.4cqw;right:-1.4cqw;width:5.2cqw;height:5.2cqw;border-radius:50%;z-index:2;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ff8a95,#e01e33 60%,#9e0c1d);border:.45cqw solid #fff;color:#fff;font:3.6cqw/1 var(--f-display);pointer-events:none}

/* ---------- generic buttons ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;gap:1.6cqw;
  height:12.5cqw;padding:0 6cqw;font:5cqw var(--f-display);font-style:italic;color:#fff;letter-spacing:.03em;text-shadow:0 .45cqw 0 rgba(4,20,70,.85);
  clip-path:polygon(3.2cqw 0,calc(100% - 3.2cqw) 0,100% 50%,calc(100% - 3.2cqw) 100%,3.2cqw 100%,0 50%);
  background:linear-gradient(180deg,#e9f4ff 0,#e9f4ff 6%,#63c6ff 7%,#1e6bff 58%,#0c3aa8 100%);transition:transform .12s,filter .12s}
.btn svg{width:5.4cqw;height:5.4cqw}
.btn:active{transform:scale(.95)}
.btn:focus-visible{filter:brightness(1.25) drop-shadow(0 0 1.2cqw #fff)}
.btn.green{background:linear-gradient(180deg,#eafff1 0,#eafff1 6%,#6ff0a0 7%,#19b257 58%,#0b7a39 100%)}
.btn.red{background:linear-gradient(180deg,#ffecee 0,#ffecee 6%,#ff8a95 7%,#e2263c 58%,#9e0c1d 100%)}
.btn.gold{background:linear-gradient(180deg,#fff8dc 0,#fff8dc 6%,#ffd86a 7%,#f0a215 58%,#a8650a 100%);text-shadow:0 .45cqw 0 rgba(90,45,0,.75)}
.btn.dark{background:linear-gradient(180deg,#c9d8ee 0,#c9d8ee 6%,#2c4a7e 7%,#15294f 58%,#0b1834 100%)}
.btn.sm{height:10cqw;font-size:3.8cqw;padding:0 4.6cqw}
.btn[disabled]{filter:grayscale(.85) brightness(.7);pointer-events:none}

/* ---------- home ---------- */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:1.5cqw;
  padding:calc(env(safe-area-inset-top,0px) + 2.6cqw) 2.6cqw 0}
.profile{display:flex;align-items:center;gap:1.6cqw;flex:1 1 0;min-width:0;cursor:pointer}
.avatar{flex:none;width:11.5cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(#2a5fb8,#0b1f45);border:.55cqw solid #d9e7ff;box-shadow:0 0 1.6cqw rgba(56,214,255,.65)}
.avatar svg{width:80%}
.pinfo{min-width:0;flex:1}
.pname{font:700 3.7cqw/1.05 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{font:700 3cqw/1.1 var(--f-body);color:var(--muted)}
.xp{height:1.4cqw;margin-top:.6cqw;border-radius:1cqw;background:#0a1a3a;overflow:hidden;border:.25cqw solid #2c4f8a}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#1e6bff,#38d6ff)}
.pill{flex:none;display:flex;align-items:center;gap:.9cqw;height:7.6cqw;padding:0 .7cqw 0 .5cqw;border-radius:2cqw;
  background:linear-gradient(180deg,#123067,#091a3b);border:.35cqw solid rgba(140,200,255,.55);box-shadow:inset 0 .3cqw 0 rgba(255,255,255,.12)}
.pill svg.ico{width:6.2cqw;height:6.2cqw}
.pill b{font:700 3.9cqw var(--f-body);font-variant-numeric:tabular-nums;min-width:10.5cqw;text-align:right}
.plus{all:unset;cursor:pointer;width:5.6cqw;height:5.6cqw;border-radius:1.3cqw;display:grid;place-items:center;
  background:linear-gradient(180deg,#5cf097,#13a14a);border:.3cqw solid #c9ffdc;color:#fff;font:4.4cqw/1 var(--f-display)}
.sqbtn{all:unset;cursor:pointer;flex:none;width:8.6cqw;height:8.6cqw;border-radius:2.2cqw;display:grid;place-items:center;
  background:linear-gradient(180deg,#1d4c9c,#0b1f48);border:.4cqw solid rgba(170,215,255,.7);box-shadow:0 0 1.4cqw rgba(56,214,255,.35)}
.sqbtn svg{width:64%}
.sqbtn:focus-visible,.plus:focus-visible{outline:.5cqw solid #fff}
#home .logo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 13cqw)}
.rail{position:absolute;top:34cqh;display:flex;flex-direction:column;gap:3.4cqw}
.rail.l{left:3cqw}.rail.r{right:3cqw}
.trackchip{all:unset;cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 27.2cqh);
  display:flex;align-items:center;gap:1.6cqw;padding:1.2cqw 2.6cqw 1.2cqw 1.6cqw;border-radius:6cqw;white-space:nowrap;
  background:linear-gradient(180deg,rgba(18,48,106,.92),rgba(7,22,52,.92));border:.35cqw solid rgba(140,200,255,.6);box-shadow:0 0 2cqw rgba(56,214,255,.35)}
.trackchip svg{width:4.6cqw}
.trackchip b{font:3.4cqw var(--f-display);letter-spacing:.02em}
.trackchip span{font:600 3.1cqw var(--f-body);color:var(--muted)}
.trackchip em{font:700 2.8cqw var(--f-body);font-style:normal;color:var(--cyan);letter-spacing:.12em;margin-left:1cqw}
.play{all:unset;cursor:pointer;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 13cqh);width:82cqw;height:20cqw;
  transform:translateX(-50%);filter:drop-shadow(0 0 3cqw rgba(56,214,255,.7)) drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.5));animation:pulse 2.2s ease-in-out infinite}
.play .frame{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);
  background:linear-gradient(170deg,#ffffff 0%,#8ea6c9 30%,#f4f8ff 50%,#56739f 72%,#dfe9f7 100%)}
.play .face{position:absolute;inset:1.3cqw 2cqw;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);overflow:hidden;
  background:linear-gradient(180deg,#a8e6ff 0%,#4cb4ff 18%,#1e6bff 55%,#0b37a6 100%);box-shadow:inset 0 0 0 .6cqw rgba(160,230,255,.7)}
.play .face::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 1.2cqw,transparent 1.2cqw 3cqw)}
.play .face::after{content:"";position:absolute;top:-20%;bottom:-20%;width:18%;left:-30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-22deg);animation:shine 3s ease-in-out infinite}
.play .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2cqw;font:10.5cqw var(--f-display);font-style:italic;color:#fff;
  letter-spacing:.04em;text-shadow:0 .8cqw 0 #0a2c86,0 0 2.5cqw rgba(255,255,255,.5)}
.play .txt svg{width:7cqw}
.play:active{transform:translateX(-50%) scale(.95)}
.play:focus-visible .frame{background:#fff}
@keyframes pulse{50%{filter:drop-shadow(0 0 5cqw rgba(56,214,255,.95)) drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.5))}}
@keyframes shine{0%,55%{left:-30%}100%{left:130%}}
.dock{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2.6cqw);display:flex;justify-content:center;gap:2.6cqw}
.dock .ib{width:21cqw}
.dock .ib>button{aspect-ratio:1/.8}
.preview-tag{position:absolute;right:2.6cqw;top:calc(env(safe-area-inset-top,0px) + 12.4cqw);font:700 2.4cqw var(--f-body);letter-spacing:.2em;
  color:#cfe8ff;background:rgba(5,15,40,.6);border:.25cqw solid rgba(140,200,255,.4);padding:.4cqw 1.4cqw;border-radius:1cqw}

/* ---------- headers for sub screens ---------- */
.subhead{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:2.4cqw;
  padding:calc(env(safe-area-inset-top,0px) + 2.6cqw) 3cqw 2.6cqw;background:linear-gradient(180deg,rgba(4,10,25,.95),rgba(4,10,25,.6) 70%,transparent)}
.subhead h2{flex:1;margin:0;font:6cqw var(--f-display);font-style:italic;letter-spacing:.03em;text-wrap:balance}
.subhead h2 small{display:block;font:700 2.8cqw var(--f-body);font-style:normal;letter-spacing:.3em;color:var(--cyan)}

/* ---------- tracks ---------- */
#tracks{background:linear-gradient(180deg,rgba(4,10,25,.82),rgba(7,22,52,.92))}
.tgrid{position:absolute;inset:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-content:start;
  padding:calc(env(safe-area-inset-top,0px) + 21cqw) 3.4cqw calc(env(safe-area-inset-bottom,0px) + 5cqw);touch-action:pan-y;scrollbar-width:thin}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:.5cqw;clip-path:polygon(4cqw 0,100% 0,100% calc(100% - 4cqw),calc(100% - 4cqw) 100%,0 100%,0 4cqw);
  background:linear-gradient(160deg,#eef5ff,#6f88b0 40%,#e4eefc 60%,#3e5a86)}
.tcard .in{position:relative;aspect-ratio:16/11;clip-path:inherit;background:linear-gradient(160deg,#173a7a,#0a1b3d);overflow:hidden}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.tcard .meta{position:absolute;left:0;right:0;bottom:0;padding:5cqw 2cqw 1.6cqw;background:linear-gradient(transparent,rgba(3,10,30,.94) 55%)}
.tcard .no{position:absolute;top:1.4cqw;right:1.4cqw;font:2.8cqw var(--f-display);background:rgba(5,15,40,.78);border:.25cqw solid rgba(140,200,255,.5);padding:.3cqw 1.3cqw;border-radius:1cqw}
.tcard .tn{font:3.8cqw/1.05 var(--f-display);letter-spacing:.01em}
.tcard .ts{font:600 2.8cqw/1.2 var(--f-body);color:#b9d3f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:.6cqw;font:700 2.6cqw var(--f-body);color:var(--gold)}
.tcard .row .best{color:#cfe8ff;font-variant-numeric:tabular-nums}
.tcard.sel{background:linear-gradient(160deg,#fff,#38d6ff 45%,#fff 60%,#1e6bff)}
.tcard:focus-visible{background:#fff}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:600 2.8cqw var(--f-body);color:var(--muted);letter-spacing:.2em}

/* ---------- panels / modals ---------- */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:5cqw;background:rgba(3,8,22,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel{position:relative;width:100%;max-height:90cqh;padding:.6cqw;
  clip-path:polygon(4cqw 0,calc(100% - 4cqw) 0,100% 4cqw,100% calc(100% - 4cqw),calc(100% - 4cqw) 100%,4cqw 100%,0 calc(100% - 4cqw),0 4cqw);
  background:linear-gradient(160deg,#f2f7ff,#7088ae 35%,#eaf2ff 55%,#3c5784);animation:pop .22s ease-out}
.panel>.in{max-height:calc(90cqh - 1.2cqw);overflow-y:auto;touch-action:pan-y;padding:5cqw 4.6cqw;display:flex;flex-direction:column;gap:3.4cqw;
  clip-path:inherit;background:radial-gradient(120% 60% at 50% 0%,#1a3f86 0%,#0d2652 45%,#071634 100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.ptitle{margin:0;text-align:center;font:7cqw var(--f-display);font-style:italic;letter-spacing:.03em;line-height:1;text-wrap:balance}
.psub{text-align:center;font:600 3.4cqw var(--f-body);color:var(--muted);margin-top:-1.6cqw}
.close{all:unset;cursor:pointer;position:absolute;top:2.6cqw;right:2.6cqw;z-index:2;width:8cqw;height:8cqw;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#ff6b78,#c3182c);border:.4cqw solid #fff;color:#fff;font:4.6cqw/1 var(--f-display)}
.close:focus-visible{outline:.5cqw solid var(--cyan)}
.list{display:flex;flex-direction:column;gap:2cqw}
.li{display:flex;align-items:center;gap:2.6cqw;padding:2.4cqw 2.8cqw;border-radius:2.4cqw;background:linear-gradient(180deg,#143469,#0b2049);border:.3cqw solid rgba(120,180,255,.35)}
.li .ic{flex:none;width:9cqw;height:9cqw;display:grid;place-items:center}
.li .ic svg{width:100%}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font:3.6cqw var(--f-display);letter-spacing:.01em}
.li .tx span{display:block;font:600 3.1cqw/1.2 var(--f-body);color:var(--muted)}
.li .prog{height:1.6cqw;border-radius:1cqw;background:#08183a;overflow:hidden;margin-top:1cqw}
.li .prog i{display:block;height:100%;background:linear-gradient(90deg,#1e6bff,#38d6ff)}
.btns{display:flex;flex-direction:column;gap:2.6cqw;align-items:stretch}
.btns.row{flex-direction:row}
.btns.row>*{flex:1;padding:0 2cqw}
.mini{all:unset;cursor:pointer;flex:none;padding:1.6cqw 3.2cqw;border-radius:1.8cqw;font:3.2cqw var(--f-display);color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.4);
  background:linear-gradient(180deg,#5cf097,#13a14a);border:.3cqw solid #c9ffdc;white-space:nowrap}
.mini.blue{background:linear-gradient(180deg,#63c6ff,#1e5be0);border-color:#cde9ff}
.mini.gray{background:linear-gradient(180deg,#5d6f8d,#33425c);border-color:#8597b5}
.mini:focus-visible{outline:.5cqw solid #fff}

/* daily grid */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:.8cqw;padding:2cqw 1cqw;border-radius:2cqw;background:#0b2049;border:.3cqw solid rgba(120,180,255,.35);font:700 3cqw var(--f-body)}
.day svg{width:8cqw}
.day.done{opacity:.45}
.day.today{border-color:var(--gold);box-shadow:0 0 2cqw rgba(255,200,58,.55);background:linear-gradient(180deg,#2a2a6a,#13204a)}
.day.big{grid-column:span 2}
.day small{font:600 2.6cqw var(--f-body);color:var(--muted)}

/* race start */
.rs-thumb{position:relative;aspect-ratio:16/10;border-radius:2.4cqw;overflow:hidden;border:.4cqw solid rgba(170,215,255,.6);background:#0b1f45}
.rs-thumb img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.rs-thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:6cqw 3cqw 2cqw;background:linear-gradient(transparent,rgba(3,10,30,.92))}
.rs-thumb .cap b{display:block;font:5.4cqw var(--f-display)}
.rs-thumb .cap span{font:600 3.2cqw var(--f-body);color:#cfe3ff}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}
.mode{all:unset;cursor:pointer;text-align:center;padding:2.2cqw 1cqw;border-radius:2.2cqw;border:.4cqw solid transparent;font:4cqw var(--f-display);display:flex;flex-direction:column;gap:.4cqw}
.mode small{font:700 2.8cqw var(--f-body);opacity:.9}
.mode.easy{background:linear-gradient(180deg,#3fdc86,#11823f)}
.mode.normal{background:linear-gradient(180deg,#4cb4ff,#1448c4)}
.mode.hard{background:linear-gradient(180deg,#ff6b78,#b3142a)}
.mode.on{border-color:#fff;box-shadow:0 0 2.6cqw rgba(255,255,255,.7)}
.mode:not(.on){filter:saturate(.55) brightness(.75)}
.mode:focus-visible{outline:.5cqw solid #fff}
.kv{display:flex;justify-content:space-between;font:600 3.5cqw var(--f-body);color:var(--muted)}
.kv b{color:#fff;font-variant-numeric:tabular-nums}

/* ---------- garage ---------- */
#garage{background:transparent}
.gname{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 17cqw);display:flex;align-items:center;justify-content:center;gap:3cqw}
.gname b{min-width:46cqw;text-align:center;font:6.4cqw var(--f-display);font-style:italic;letter-spacing:.03em;text-shadow:0 .5cqw 0 #061a48,0 0 2cqw rgba(56,214,255,.6)}
.arrow{all:unset;cursor:pointer;width:9cqw;height:9cqw;display:grid;place-items:center;border-radius:2cqw;background:linear-gradient(180deg,#1d4c9c,#0b1f48);border:.4cqw solid rgba(170,215,255,.7)}
.arrow svg{width:55%}
.arrow:focus-visible{outline:.5cqw solid #fff}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:4cqw 3.4cqw calc(env(safe-area-inset-bottom,0px) + 4cqw);display:flex;flex-direction:column;gap:2.8cqw;
  background:linear-gradient(180deg,rgba(7,22,52,.0),rgba(7,22,52,.92) 8%,rgba(4,10,25,.98));border-top:.35cqw solid rgba(140,200,255,.35)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:1.4cqw 2.4cqw;align-items:center;font:700 3cqw var(--f-body);letter-spacing:.14em;color:var(--muted)}
.stats .sb{height:2cqw;border-radius:1cqw;background:#0a1a3a;overflow:hidden;border:.25cqw solid #2c4f8a}
.stats .sb i{display:block;height:100%;background:linear-gradient(90deg,#1e6bff,#38d6ff);box-shadow:0 0 1.4cqw #38d6ff;transition:width .3s}
.stats .v{font-variant-numeric:tabular-nums;color:#fff;letter-spacing:0}
.tabs{display:flex;gap:2cqw}
.tab{all:unset;cursor:pointer;flex:1;text-align:center;padding:2cqw 0;border-radius:2cqw;font:3.8cqw var(--f-display);background:#0b2049;border:.35cqw solid rgba(120,180,255,.35);color:var(--muted)}
.tab.on{background:linear-gradient(180deg,#2c68cc,#0f2c66);color:#fff;border-color:var(--cyan)}
.tab:focus-visible{outline:.5cqw solid #fff}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw}
.skin{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:.4cqw;padding:1.6cqw .6cqw 1.4cqw;border-radius:2.2cqw;
  background:linear-gradient(180deg,#143469,#0b2049);border:.35cqw solid rgba(120,180,255,.3)}
.skin svg{width:15cqw;height:9cqw}
.skin b{font:2.4cqw var(--f-display);text-align:center;line-height:1.05}
.skin span{font:700 2.6cqw var(--f-body);color:var(--gold);display:flex;align-items:center;gap:.6cqw}
.skin span svg{width:3cqw;height:3cqw}
.skin span.own{color:var(--green)}
.skin.on{border-color:var(--cyan);box-shadow:0 0 2cqw rgba(56,214,255,.55);background:linear-gradient(180deg,#1f4c9a,#0f2c66)}
.skin:focus-visible{outline:.5cqw solid #fff}
.upg .lv{display:flex;gap:.8cqw;margin-top:1cqw}
.upg .lv i{flex:1;height:1.6cqw;border-radius:.6cqw;background:#08183a;border:.2cqw solid #2c4f8a}
.upg .lv i.on{background:linear-gradient(90deg,#1e6bff,#38d6ff);border-color:#38d6ff}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:2cqw;padding:calc(env(safe-area-inset-top,0px) + 2.6cqw) 3cqw 0}
#hud .sqbtn{pointer-events:auto}
.hpill{display:flex;align-items:center;gap:1.4cqw;height:8.6cqw;padding:0 3cqw;border-radius:2.2cqw;background:linear-gradient(180deg,rgba(18,48,106,.88),rgba(7,22,52,.88));
  border:.35cqw solid rgba(140,200,255,.55);font:4.6cqw var(--f-display);font-variant-numeric:tabular-nums}
.hpill svg{width:6cqw;height:6cqw}
.hpill.coin{margin-left:auto}
.hpill.coin.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.12)}}
.speedo{position:absolute;left:3cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 4cqw);width:22cqw;aspect-ratio:1;border-radius:50%;
  background:conic-gradient(from 225deg,#38d6ff calc(var(--p,0)*75%),rgba(56,214,255,.15) 0 75%,transparent 0);display:grid;place-items:center;
  filter:drop-shadow(0 0 1.6cqw rgba(56,214,255,.6))}
.speedo .in{width:84%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#13306a,#06112b);display:flex;flex-direction:column;align-items:center;justify-content:center;border:.3cqw solid rgba(140,200,255,.4)}
.speedo b{font:7.4cqw/1 var(--f-display);font-variant-numeric:tabular-nums}
.speedo small{font:700 2.5cqw var(--f-body);letter-spacing:.14em;color:var(--muted)}
.pups{position:absolute;right:3cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 4cqw);display:flex;gap:2cqw}
.pu{width:13cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--t)*100%),rgba(255,255,255,.12) 0);
  filter:drop-shadow(0 0 1.4cqw var(--c))}
.pu .in{width:82%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#173a7a,#081a3d);display:grid;place-items:center}
.pu svg{width:62%}
.banner{position:absolute;left:0;right:0;top:24cqh;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
.banner.show{opacity:1}
.banner b{display:block;font:7cqw var(--f-display);font-style:italic;text-shadow:0 .6cqw 0 #061a48,0 0 3cqw rgba(56,214,255,.8)}
.banner span{font:700 3.4cqw var(--f-body);letter-spacing:.3em;color:#d6ecff;text-shadow:0 .3cqw .6cqw #000}
#count{position:absolute;inset:0;z-index:12;display:grid;place-items:center;pointer-events:none}
#count b{font:30cqw var(--f-display);font-style:italic;color:#fff;-webkit-text-stroke:.8cqw #0a2a6e;paint-order:stroke fill;
  text-shadow:0 1.2cqw 0 #061a48,0 0 5cqw rgba(56,214,255,.9);animation:cnt .6s ease-out both}
@keyframes cnt{from{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.9);opacity:.2}}
#tut{position:absolute;left:6cqw;right:6cqw;top:40cqh;z-index:11;pointer-events:none;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;
  padding:4cqw;border-radius:3cqw;background:rgba(4,12,32,.78);border:.35cqw solid rgba(140,200,255,.5);transition:opacity .5s}
#tut div{display:flex;align-items:center;gap:2cqw;font:700 3.4cqw var(--f-body)}
#tut kbd{flex:none;width:8cqw;height:8cqw;border-radius:2cqw;display:grid;place-items:center;font:4.4cqw var(--f-display);background:linear-gradient(180deg,#2c68cc,#0f2c66);border:.3cqw solid var(--cyan)}

/* result */
.res-big{text-align:center}
.res-big small{display:block;font:700 3.2cqw var(--f-body);letter-spacing:.3em;color:var(--muted)}
.res-big b{display:block;font:12cqw/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.newbest{display:inline-block;margin-top:1cqw;padding:.6cqw 2.6cqw;transform:rotate(-4deg);font:3.6cqw var(--f-display);color:#3a2000;background:linear-gradient(180deg,#fff2a8,#ffb300);border-radius:1.4cqw;box-shadow:0 0 2.6cqw rgba(255,200,58,.7)}
.reswrap{display:grid;grid-template-columns:1fr auto;gap:3cqw;align-items:center}
.rank{width:22cqw;aspect-ratio:1;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#fff4c2,#d98d0e 50%,#ffe28a);position:relative}
.rank::before{content:"";position:absolute;inset:1.2cqw;clip-path:inherit;background:radial-gradient(#e53346,#8a0c1c)}
.rank b{position:relative;font:12cqw/1 var(--f-display);color:#fff;text-shadow:0 .6cqw 0 #4a0610}
.rank small{position:absolute;bottom:-5cqw;left:0;right:0;text-align:center;font:700 2.8cqw var(--f-body);letter-spacing:.2em;color:var(--gold)}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 36cqh);z-index:50;transform:translate(-50%,2cqw);max-width:84cqw;text-align:center;
  padding:2.2cqw 4cqw;border-radius:2.4cqw;background:rgba(4,12,32,.92);border:.35cqw solid var(--cyan);font:700 3.4cqw var(--f-body);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.play,.play .face::after{animation:none}.panel{animation:none}}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

/* =========================================================
   Utilities, save, audio
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.floor(n).toLocaleString('en-US');
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = new THREE.Vector3(0, 1, 0);
const today = () => new Date().toISOString().slice(0, 10);

const SAVE_KEY = 'skybikerun.preview.v1';
const DEFAULT_SAVE = { coins: 2500, gems: 120, best: 0, owned: ['blue'], skin: 'blue', track: 0, mode: 'normal', xp: 0, runs: 0,
  totalCoins: 0, dailyDay: 0, dailyLast: '', upg: { magnet: 0, shield: 0, nitro: 0, x2: 0 }, trackBest: {}, sound: true,
  quality: 'high', tutorial: false, claimed: {}, name: 'Rider' + String(Math.floor(rand(100, 999))) };
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
const save = Object.assign(structuredClone(DEFAULT_SAVE), loadSave());
save.upg = Object.assign({ magnet: 0, shield: 0, nitro: 0, x2: 0 }, save.upg);
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage off: play on */ } }

const Snd = {
  ctx: null, master: null, eng: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = save.sound ? 0.5 : 0; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  tone(f, d = .1, type = 'sine', v = .2, slide = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .03);
  },
  noise(d = .4, v = .3, freq = 900) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    const b = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * d), this.ctx.sampleRate); const ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = this.ctx.createBufferSource(); s.buffer = b; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = v; s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  coin() { this.tone(1320, .07, 'square', .05); setTimeout(() => this.tone(1980, .09, 'square', .045), 40); },
  jump() { this.tone(260, .22, 'triangle', .16, 520); },
  slide() { this.noise(.28, .16, 2400); },
  crash() { this.noise(.7, .55, 700); this.tone(140, .5, 'sawtooth', .18, -90); },
  power() { [660, 880, 1100, 1480].forEach((f, i) => setTimeout(() => this.tone(f, .12, 'triangle', .13), i * 55)); },
  click() { this.tone(880, .05, 'triangle', .1); },
  cash() { [990, 1320].forEach((f, i) => setTimeout(() => this.tone(f, .1, 'square', .05), i * 70)); },
  engineStart() {
    if (!this.ctx || this.eng) return;
    const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 60; o2.frequency.value = 30; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = .035;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o.start(); o2.start(); this.eng = { o, o2, g };
  },
  engineSet(sp) { if (this.eng) { const t = this.ctx.currentTime; this.eng.o.frequency.setTargetAtTime(42 + sp * 2.1, t, .12); this.eng.o2.frequency.setTargetAtTime(21 + sp * 1.05, t, .12); } },
  engineStop() { if (this.eng) { try { this.eng.o.stop(); this.eng.o2.stop(); } catch (e) {} this.eng = null; } },
  setOn(on) { save.sound = on; persist(); if (this.master) this.master.gain.value = on ? .5 : 0; }
};

/* =========================================================
   Icons (inline SVG)
   ========================================================= */
const ICON = {
  coin: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#e08a00"/><circle cx="24" cy="23" r="20" fill="#ffb300"/><circle cx="24" cy="23" r="15" fill="#ffd54a" stroke="#e59400" stroke-width="2"/><path d="M24 12.5l3.2 7 7.6.7-5.7 5 1.7 7.5L24 28.8l-6.8 3.9 1.7-7.5-5.7-5 7.6-.7z" fill="#fff6c2"/></svg>',
  gem: '<svg viewBox="0 0 48 48"><path d="M24 3l17 15-17 27L7 18z" fill="#2f8fff"/><path d="M24 3l17 15H7z" fill="#8fd8ff"/><path d="M24 3l6 15H18z" fill="#e6f8ff"/><path d="M7 18h34L24 45z" fill="#1e6bff" opacity=".55"/></svg>',
  gift: '<svg viewBox="0 0 48 48"><rect x="7" y="21" width="34" height="22" rx="3" fill="#f39a16"/><rect x="5" y="14" width="38" height="9" rx="3" fill="#ffc84a"/><rect x="21" y="14" width="6" height="29" fill="#e8344a"/><path d="M24 14c-4-8-13-9-12-2 1 4 8 3 12 2zm0 0c4-8 13-9 12-2-1 4-8 3-12 2z" fill="#ff5a6c"/></svg>',
  missions: '<svg viewBox="0 0 48 48"><rect x="9" y="8" width="30" height="35" rx="4" fill="#eaf3ff"/><rect x="17" y="4.5" width="14" height="7" rx="2" fill="#8fb0d9"/><path d="M15.5 26l6.5 6.5 11-13" stroke="#1e6bff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    fragmentShader: `uniform vec3 top,mid,bot,sunCol,sunDir;uniform float night;varying vec3 vP;

      void main(){float y=vP.y;vec3 c=y>0.?mix(mid,top,pow(clamp(y/.55,0.,1.),.75)):mix(mid,bot,clamp(-y*5.,0.,1.));

function speedNow() { const d = difficulty(); let s = 24 * MODES[save.mode].speed * (1 + .75 * d); if (P.nitro > 0) s *= 1.55; return s; }
function puDur(kind) { return PU[kind].base + save.upg[kind] * (kind === 'nitro' ? .6 : 1.5); }

function spawnObstacle(kind, lane, z) {
  const proto = pick(OB[kind]), mesh = proto.clone(), info = OB_INFO[kind];
  mesh.position.set(lane * LANE, 0, z); scene.add(mesh);
  obstacles.push({ mesh, kind, lane, x: lane * LANE, zc: z + info.off, halfL: info.halfL, halfW: info.halfW, alive: true, vel: null });
}
function spawnCoin(x, y, z) { const mesh = makeCoin(); mesh.position.set(x, y, z); scene.add(mesh); coins.push({ mesh, alive: true }); }
function spawnRow(z) {
  const d = difficulty(); const lanes = [null, null, null]; const r = Math.random();
  if (d > .12 && r < .1) lanes.fill('B');
  else if (d > .22 && r < .19) lanes.fill('G');
  else {
    const n = Math.random() < .3 + d * .45 ? 2 : 1; const idx = [0, 1, 2].sort(() => Math.random() - .5).slice(0, n);
    const kinds = d < .1 ? ['T', 'C', 'B'] : ['T', 'T', 'C', 'B', 'G'];
    for (const i of idx) lanes[i] = pick(kinds);
    if (Math.random() < d * .35) { const free = lanes.findIndex(v => v === null); if (free >= 0) lanes[free] = pick(['B', 'G']); }
  }
  // fairness: at most two lanes may be fully blocking (truck/container)
  if (lanes.filter(v => v === 'T' || v === 'C').length > 2) lanes[2] = 'B';
  lanes.forEach((k, i) => { if (k) spawnObstacle(k, i - 1, k === 'T' ? z - 3.3 : k === 'C' ? z - 3 : z); });
  const gap = Math.max(17, speedNow() * lerp(1.2, .72, d));
  // coins
  const open = [0, 1, 2].filter(i => !lanes[i]);
  if (lanes.every(k => k === 'B')) { for (let k = -3; k <= 3; k++) spawnCoin(0, 1 + 1.4 * Math.cos(k / 3 * Math.PI / 2), z - k * 1.6); }
  else if (open.length) { const L = pick(open) - 1; const n = Math.floor(gap / 3.2) - 2; for (let k = 0; k < n; k++) spawnCoin(L * LANE, .9, z - 4 - k * 3.2); }
  if (open.length && Math.random() < .075) { const L = pick(open) - 1, kind = pick(Object.keys(PU)); const mesh = makePU(kind); mesh.position.set(L * LANE + (open.length > 1 ? 0 : 0), 1.1, z - gap / 2); scene.add(mesh); pups.push({ mesh, kind, alive: true }); }
  return gap;
}

function action(a) {
  if (G.state !== 'run' || !P.alive) return;
  if (a === 'left' || a === 'right') {
    const nl = clamp(P.lane + (a === 'left' ? -1 : 1), -1, 1);
    if (nl === P.lane) { G.camShake = .15; return; }
    P.lane = nl; P.slideSide = a === 'left' ? 1 : -1; Snd.tone(420, .06, 'triangle', .07, 120);
  } else if (a === 'up') {
    if (P.y < .05) { P.vy = JUMP_V; P.slide = 0; Snd.jump(); }
  } else if (a === 'down') {
    if (P.y > .05) P.vy = -26; P.slide = .78; Snd.slide();
  }
}

function startRun() {
  Snd.init(); Snd.engineStart();
  clearRunObjects();
  P = newPlayer(G.homeZ); nextRowZ = P.z - 70;
  G.state = 'countdown'; G.count = 1.8; G.lastCount = null;
  showScreen('hud'); $('#pups').innerHTML = ''; updateHud(true);
  const t = theme(); $('#bannerT').textContent = t.name.toUpperCase(); $('#bannerS').textContent = t.place.toUpperCase() + ' · ' + MODES[save.mode].label; $('#banner').classList.add('show');
  $('#count').hidden = false;
  if (!save.tutorial) { $('#tut').hidden = false; $('#tut').style.opacity = 1; }
}
function crash(ob) {
  P.alive = false; P.crashT = 0; G.camShake = .6; Snd.crash(); Snd.engineStop();
  burst(V(P.x, 1, P.z), '#ff8a3a', 26, 7); burst(V(P.x, 1, P.z), '#ffd54a', 14, 5);
  if (ob) ob.alive = false;
}
function smash(o) { o.alive = false; o.vel = V(rand(-6, 6), rand(6, 10), -rand(8, 14)); burst(V(o.x, 1.4, o.zc), '#38d6ff', 14, 6); G.camShake = .25; }
function endRun() {
  G.state = 'over'; const dist = Math.floor(P.z0 - P.z); const mul = MODES[save.mode].coin;
  const earned = Math.floor(P.coins * mul + dist / 40); const newBest = dist > save.best;
  save.coins += earned; save.totalCoins += P.coins; save.runs++; save.xp += dist / 4;
  if (newBest) save.best = dist; const tb = save.trackBest[theme().idx] || 0; if (dist > tb) save.trackBest[theme().idx] = dist; persist();
  const rank = dist >= 4000 ? 'S' : dist >= 2200 ? 'A' : dist >= 1000 ? 'B' : 'C';
  openModal(`
    <h2 class="ptitle chrome-text">RUN OVER</h2>
    <div class="reswrap">
      <div class="res-big"><small>DISTANCE</small><b>${fmt(dist)} m</b>${newBest ? '<span class="newbest">NEW BEST!</span>' : ''}</div>
      <div class="rank"><b>${rank}</b><small>RANK</small></div>
    </div>
    <div class="list" style="margin-top:3cqw">
      <div class="kv"><span>Coins collected</span><b>${fmt(P.coins)}</b></div>
      <div class="kv"><span>${MODES[save.mode].label} bonus</span><b>× ${mul.toFixed(1)}</b></div>
      <div class="kv"><span>Distance bonus</span><b>${fmt(dist / 40)}</b></div>
      <div class="kv"><span>Track</span><b>${theme().name}</b></div>
      <div class="kv" style="color:var(--gold)"><span>Earned</span><b style="color:var(--gold)">+${fmt(earned)}</b></div>
    </div>
    <div class="btns">
      ${!P.revived && save.gems >= 20 ? `<button class="btn gold" id="reviveBtn">${ICON.gem} CONTINUE · 20</button>` : ''}
      <button class="btn" id="againBtn">${ICON.restart} RESTART</button>
      <div class="btns row"><button class="btn dark sm" id="homeBtn">${ICON.home} HOME</button><button class="btn dark sm" id="garBtn">${ICON.bike} GARAGE</button></div>
    </div>`, false);
  Snd.cash();
  $('#againBtn').onclick = () => { closeModal(); G.homeZ = P.z - 30; world.reset(G.homeZ); startRun(); };
  $('#homeBtn').onclick = () => { closeModal(); goHome(); };
  $('#garBtn').onclick = () => { closeModal(); goHome(); openGarage(); };
  const rv = $('#reviveBtn'); if (rv) rv.onclick = () => {
    save.gems -= 20; persist(); closeModal(); P.revived = true; P.alive = true; P.inv = 2.2; P.y = 0; P.vy = 0;
    for (const o of obstacles) if (o.zc < P.z + 5 && o.zc > P.z - 40) { o.alive = false; scene.remove(o.mesh); }
    bike.body.rotation.set(0, 0, 0); bike.body.position.set(0, 0, 0); G.state = 'run'; showScreen('hud'); Snd.engineStart();
  };
}

/* =========================================================
   Per-frame updates
   ========================================================= */
function updateRun(dt) {
  const t = theme();
  if (P.alive) {
    P.speed = lerp(P.speed, speedNow(), Math.min(1, dt * 2));
    P.z -= P.speed * dt;
    while (nextRowZ > P.z - 230) nextRowZ -= spawnRow(nextRowZ);
    const tx = P.lane * LANE; const dx = tx - P.x; P.x += dx * Math.min(1, dt * 13);
    if (P.y > 0 || P.vy > 0) { P.vy -= GRAV * dt; P.y += P.vy * dt; if (P.y <= 0) { P.y = 0; P.vy = 0; burst(V(P.x, .1, P.z + .6), '#cfd6df', 6, 2.5); } }
    if (P.slide > 0) P.slide -= dt;
    for (const k of ['magnet', 'nitro', 'x2', 'inv']) if (P[k] > 0) P[k] = Math.max(0, P[k] - dt);
    P.wheel += P.speed * dt / .43;
    // collisions
    for (const o of obstacles) {
      if (!o.alive) continue; if (Math.abs(o.zc - P.z) > o.halfL + .9) continue; if (Math.abs(o.x - P.x) > o.halfW + .4) continue;
      const hit = o.kind === 'B' ? P.y < .95 : o.kind === 'G' ? !(P.slide > 0 && P.y < .45) : true;
      if (!hit) continue;
      if (P.nitro > 0 || P.inv > 0) { smash(o); continue; }
      if (P.shield) { P.shield = false; P.inv = 1.2; smash(o); Snd.power(); continue; }
      crash(o); break;
    }
    // coins
    const mag = P.magnet > 0 || P.nitro > 0;
    for (const c of coins) {
      if (!c.alive) continue; const m = c.mesh; m.rotation.y += dt * 4;
      if (mag) { const dz = m.position.z - P.z; if (dz < 2 && dz > -14) { m.position.x = lerp(m.position.x, P.x, Math.min(1, dt * 9)); m.position.y = lerp(m.position.y, P.y + .9, Math.min(1, dt * 9)); m.position.z = lerp(m.position.z, P.z, Math.min(1, dt * (dz < -6 ? 3 : 9))); } }
      if (Math.abs(m.position.z - P.z) < 1.1 && Math.abs(m.position.x - P.x) < 1.15 && Math.abs(m.position.y - (P.y + .8)) < 1.5) {
        c.alive = false; scene.remove(m); P.coins += P.x2 > 0 ? 2 : 1; Snd.coin(); burst(m.position, '#ffd54a', 4, 2.4); const pill = $('#hudCoinPill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
      }
    }
    for (const p of pups) {
      if (!p.alive) continue; p.mesh.position.y = 1.1 + Math.sin(G.t * 3) * .15; p.mesh.userData.ring.rotation.y += dt * 3;
      if (Math.abs(p.mesh.position.z - P.z) < 1.2 && Math.abs(p.mesh.position.x - P.x) < 1.3 && P.y < 2.6) {
        p.alive = false; scene.remove(p.mesh); Snd.power(); burst(p.mesh.position, PU[p.kind].color, 16, 5); toast(PU[p.kind].label + '!');
        if (p.kind === 'shield') P.shield = true; else P[p.kind] = puDur(p.kind);
      }
    }
  } else {
    P.crashT += dt; P.speed = lerp(P.speed, 0, Math.min(1, dt * 3)); P.z -= P.speed * dt * .6;
    bike.body.rotation.x -= dt * 7 * Math.max(0, 1 - P.crashT); bike.body.position.y = Math.max(0, Math.sin(Math.min(1, P.crashT * 1.6) * Math.PI) * 1.6);
    if (P.crashT > 1.3 && G.state === 'run') endRun();
  }
  // smashed debris + cleanup
  for (let i = obstacles.length - 1; i >= 0; i--) { const o = obstacles[i];
    if (o.vel) { o.vel.y -= GRAV * dt; o.mesh.position.addScaledVector(o.vel, dt); o.mesh.rotation.x += dt * 5; o.mesh.rotation.z += dt * 3; }
    if (o.zc > P.z + 18 || o.mesh.position.y < -30) { scene.remove(o.mesh); obstacles.splice(i, 1); } }
  for (const a of [coins, pups]) for (let i = a.length - 1; i >= 0; i--) if (!a[i].alive || a[i].mesh.position.z > P.z + 10) { scene.remove(a[i].mesh); a.splice(i, 1); }
  world.update(P.z, dt);
  // bike pose
  const r = bike.root; r.position.set(P.x, P.y, P.z);
  if (P.alive) {
    const lean = clamp((P.lane * LANE - P.x) * -.22, -.5, .5); const sl = P.slide > 0 && P.y < .45 ? 1 : 0;
    P.roll = lerp(P.roll, lean + sl * P.slideSide * 1.05, Math.min(1, dt * 12)); P.pitch = lerp(P.pitch, P.y > 0 ? clamp(P.vy * .025, -.25, .28) : 0, Math.min(1, dt * 10));
    bike.body.rotation.set(P.pitch, 0, P.roll); bike.body.position.y = -sl * .18; bike.rider.position.y = -sl * .12; bike.rider.rotation.x = sl * .25;
  }
  bike.wheels.forEach(w => { w.rotation.x = -P.wheel; });
  bike.flame.visible = P.nitro > 0 && P.alive; if (bike.flame.visible) bike.flame.scale.set(1, rand(.8, 1.3), 1);
  bike.shield.visible = P.shield || P.inv > 0; bike.shield.rotation.y += dt; bike.shield.material.opacity = P.inv > 0 && !P.shield ? .08 + Math.abs(Math.sin(G.t * 12)) * .12 : .16;
  bike.magnet.visible = P.magnet > 0; bike.magnet.scale.setScalar(1 + Math.sin(G.t * 8) * .08);
  Snd.engineSet(P.speed);
  // camera
  G.fovT = P.nitro > 0 ? 74 : 60 + clamp((P.speed - 24) * .25, 0, 6);
  setCam(V(P.x * .62, 3.15 + P.y * .45, P.z + 6.4), V(P.x * .85, 1.25 + P.y * .55, P.z - 8), dt, 8);
  // wind streaks
  const showS = P.speed > 30 || P.nitro > 0;
  streaks.forEach(s => { if (!showS) { s.visible = false; return; } if (!s.visible || s.position.z > camera.position.z + 2) { s.visible = true; s.position.set(P.x + rand(-7, 7), rand(.3, 6), P.z - rand(10, 50)); } s.position.z += P.speed * dt * 1.4; });
  streakMat.opacity = P.nitro > 0 ? .55 : .22;
  updateHud();
}
function setCam(pos, look, dt, rate) {
  camera.position.lerp(pos, Math.min(1, dt * rate));
  if (G.camShake > 0) { G.camShake = Math.max(0, G.camShake - dt); camera.position.x += rand(-1, 1) * G.camShake * .5; camera.position.y += rand(-1, 1) * G.camShake * .5; }
  G.look = G.look ? G.look.lerp(look, Math.min(1, dt * rate)) : look.clone(); camera.lookAt(G.look);
  if (Math.abs(camera.fov - G.fovT) > .05) { camera.fov = lerp(camera.fov, G.fovT, Math.min(1, dt * 4)); camera.updateProjectionMatrix(); }
}
function updateHome(dt) {
  G.homeZ -= 9 * dt; const z = G.homeZ;
  bike.root.position.set(0, 0, z); bike.body.rotation.set(0, 0, Math.sin(G.t * .7) * .04); bike.body.position.y = 0; bike.rider.position.y = 0; bike.rider.rotation.x = 0;
  bike.wheels.forEach(w => { w.rotation.x -= dt * 9 / .43; }); bike.flame.visible = false; bike.shield.visible = false; bike.magnet.visible = false;
  world.update(z, dt); G.fovT = 50;
  setCam(V(-2.5 + Math.sin(G.t * .25) * .5, 1.45, z + 4.3), V(.5, 1.25, z - 3), dt, 3);
}

  if (force || hudCache.s !== sp) { $('#hudSpeed').textContent = sp; $('#speedo').style.setProperty('--p', clamp(sp / 420, 0, 1)); hudCache.s = sp; }
  const act = []; if (P.shield) act.push(['shield', 1]); for (const k of ['magnet', 'nitro', 'x2']) if (P[k] > 0) act.push([k, P[k] / puDur(k)]);
  const key = act.map(a => a[0]).join();
  if (force || hudCache.k !== key) { $('#pups').innerHTML = act.map(([k]) => `<div class="pu" data-k="${k}" style="--c:${PU[k].color};--t:1"><div class="in">${ICON[PU[k].icon]}</div></div>`).join(''); hudCache.k = key; }

}

  vip() {
    openModal(`<h2 class="ptitle" style="color:var(--gold)">VIP PASS</h2><div class="psub">Perks planned for the full game</div>
      <div class="list">${[['coin', 'Double coins every run'], ['gem', '100 gems every week'], ['bike', 'Exclusive Gold Legend skin'], ['play', 'No interstitial ads']].map(([i, t]) => `<div class="li"><div class="ic">${ICON[i]}</div><div class="tx"><b>${t}</b></div></div>`).join('')}</div>
      <button class="btn gold" disabled>COMING SOON</button>`);
  },
  shop() {
    const packs = [['Coin Pack', 500, '$0.99'], ['Stack Pack', 1200, '$1.99'], ['Chest Pack', 2500, '$3.99'], ['Vault Pack', 6000, '$4.99'], ['Sky Pack', 13000, '$9.99']];
    openModal(`<h2 class="ptitle chrome-text">SHOP</h2><div class="psub">Prices shown for layout review only</div><div class="list">${packs.map(([n, c, p]) => `<div class="li"><div class="ic">${ICON.coin}</div><div class="tx"><b>${n}</b><span>${fmt(c)} coins</span></div><button class="mini" data-buy>${p}</button></div>`).join('')}
      <div class="li"><div class="ic">${ICON.gem}</div><div class="tx"><b>Free Gems</b><span>Watch a rewarded ad in the full game</span></div><button class="mini blue" id="freeGems">+10</button></div></div>`);
    $$('[data-buy]').forEach(b => b.onclick = () => toast('Purchases are switched off in this preview'));
    $('#freeGems').onclick = () => { save.gems += 10; persist(); Snd.cash(); toast('+10 gems'); refreshWallet(); };
  },
  leader() {
    const names = ['Andy', 'RedLine', 'Chloe', 'Hugo', 'JiHoon', 'Sofia_R', 'KhanhRacer', 'Mai_Lan', 'Pierre', 'Yuki'];

    openModal(`<h2 class="ptitle chrome-text">RANKING</h2><div class="psub">Best distance · sample board</div><div class="list">${rows.map((r, i) => `<div class="li" style="${r.me ? 'border-color:var(--cyan);background:linear-gradient(180deg,#1f4c9a,#0f2c66)' : ''}"><div class="ic" style="font:4.4cqw var(--f-display);color:${i < 3 ? 'var(--gold)' : '#fff'}">${i + 1}</div><div class="tx"><b>${r.n}</b></div><b style="font:3.8cqw var(--f-display);font-variant-numeric:tabular-nums">${fmt(r.s)} m</b></div>`).join('')}</div>`);
  },
  settings() {
    openModal(`<h2 class="ptitle chrome-text">SETTINGS</h2><div class="list">
      <div class="li"><div class="ic">${ICON.sound}</div><div class="tx"><b>Sound</b><span>Engine, coins and effects</span></div><button class="mini ${save.sound ? '' : 'gray'}" id="sSound">${save.sound ? 'ON' : 'OFF'}</button></div>

    $('#sName').onclick = () => { save.name = pick(['Rider', 'Pilot', 'Storm', 'Neon', 'Blaze']) + Math.floor(rand(100, 9999)); persist(); refreshWallet(); PANELS.settings(); };
    $('#sReset').onclick = function () { if (this.dataset.ok) { const keep = save.sound; Object.keys(save).forEach(k => delete save[k]); Object.assign(save, structuredClone(DEFAULT_SAVE), { sound: keep }); persist(); applySkin(bike, skinById(save.skin)); world.setTheme(theme()); refreshWallet(); closeModal(); toast('Progress reset'); } else { this.dataset.ok = 1; this.textContent = 'SURE?'; } };
  },
  more() {
    openModal(`<h2 class="ptitle chrome-text">MORE</h2><div class="list">
      <div class="li"><div class="ic">${ICON.trophy}</div><div class="tx"><b>Ranking</b><span>Best distance board</span></div><button class="mini blue" data-go="leader">OPEN</button></div>
      <div class="li"><div class="ic">${ICON.globe}</div><div class="tx"><b>World Tour</b><span>20 landmark tracks</span></div><button class="mini blue" data-go="tracks">OPEN</button></div>
      <div class="li"><div class="ic">${ICON.gear}</div><div class="tx"><b>Settings</b><span>Sound, graphics, name</span></div><button class="mini blue" data-go="settings">OPEN</button></div>
      <div class="li"><div class="ic">${ICON.bike}</div><div class="tx"><b>About this preview</b><span>Bike Rush · new home, buttons, garage and world tracks. The bike here is a stand-in until the v7 rider asset is merged.</span></div></div></div>`);
    $$('[data-go]').forEach(b => b.onclick = () => { const g = b.dataset.go; closeModal(); if (g === 'tracks') openTracks(); else PANELS[g](); });
  },
  upgrade() { openGarage('upgrade'); },
  garage() { openGarage('bikes'); },
};
$$('[data-open]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); Snd.init(); Snd.click(); PANELS[b.dataset.open](); }));
$('#profileBtn').onclick = () => { Snd.init(); PANELS.settings(); };
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && $('#mClose')) closeModal(); });

/* tracks */
const tgrid = $('#tgrid');
tgrid.innerHTML = THEMES.map((t, i) => `<button class="tcard" data-t="${i}"><div class="in"><div class="ph">LOADING</div><img alt="" hidden><span class="no">${String(i + 1).padStart(2, '0')}</span>
  <div class="meta"><div class="tn">${t.name}</div><div class="ts">${t.place} · ${t.country}</div><div class="row"><span>${'★'.repeat(t.stars)}<span style="opacity:.3">${'★'.repeat(5 - t.stars)}</span></span><span class="best"></span></div></div></div></button>`).join('');
$$('.tcard').forEach(c => c.onclick = () => { Snd.click(); openRaceStart(+c.dataset.t); });
function refreshTrackCards() { $$('.tcard').forEach(c => { const i = +c.dataset.t; c.classList.toggle('sel', i === save.track); const b = save.trackBest[i]; c.querySelector('.best').textContent = b ? fmt(b) + ' m' : ''; }); }
function openTracks() { showScreen('tracks'); refreshTrackCards(); refreshWallet(); G.state = 'tracks'; thumbQueue(); const sel = tgrid.querySelector('.sel'); if (sel) sel.scrollIntoView({ block: 'center' }); }
$('#trackChip').onclick = () => { Snd.init(); Snd.click(); openTracks(); };
function openRaceStart(i) {
  const t = THEMES[i]; const sel = save.mode;
  openModal(`<h2 class="ptitle chrome-text">RACE START</h2>
    <div class="rs-thumb"><img src="${thumbFor(i)}" alt="${t.place}"><div class="cap"><b>${t.name}</b><span>${t.place} · ${t.country}</span></div></div>
    <div class="kv"><span>Difficulty</span><b style="color:var(--gold)">${'★'.repeat(t.stars)}<span style="opacity:.3">${'★'.repeat(5 - t.stars)}</span></b></div>
    <div class="kv"><span>Your best here</span><b>${save.trackBest[i] ? fmt(save.trackBest[i]) + ' m' : 'Not ridden yet'}</b></div>
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode ${k} ${k === sel ? 'on' : ''}" data-mode="${k}">${m.label}<small>Coin × ${m.coin.toFixed(1)}</small></button>`).join('')}</div>
    <button class="btn" id="goBtn">${ICON.play} START</button>`);
  $$('[data-mode]').forEach(b => b.onclick = () => { Snd.click(); save.mode = b.dataset.mode; persist(); $$('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#goBtn').onclick = () => { closeModal(); if (save.track !== i) { save.track = i; persist(); world.setTheme(t); } startRun(); };
}

/* thumbnails rendered from the real track scenes */
let thumbR = null; const thumbCache = {};
function thumbFor(i) {
  if (thumbCache[i]) return thumbCache[i];
  if (!thumbR) { thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); thumbR.setSize(352, 242, false); thumbR.toneMapping = THREE.NeutralToneMapping; }
  const t = THEMES[i], sc = new THREE.Scene(); const sm = makeSkyMat(); applySkyColors(sm, t); sc.add(new THREE.Mesh(new THREE.SphereGeometry(800, 24, 12), sm));
  sc.fog = new THREE.Fog(t.fog, 80, 560); sc.add(new THREE.HemisphereLight(t.hemi[0], t.hemi[1], t.hemiI ?? 1.15)); const s = new THREE.DirectionalLight(t.sun, t.sunI ?? 2.4); s.position.set(-30, 40, -60); sc.add(s); const f = new THREE.DirectionalLight('#fff', .8); f.position.set(10, 20, 30); sc.add(f);
  const gm = new THREE.MeshStandardMaterial({ color: t.ground, roughness: t.water ? .2 : .95, metalness: t.water ? .25 : 0, map: t.water ? null : noiseTex });
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), gm); gr.rotation.x = -Math.PI / 2; gr.position.y = GY; sc.add(gr);
  box(sc, 13, 1.4, 400, M('#3a4458'), 0, -.7, -150); box(sc, .2, .2, 400, new THREE.MeshBasicMaterial({ color: t.accent }), 6.6, 1, -150); box(sc, .2, .2, 400, new THREE.MeshBasicMaterial({ color: t.accent }), -6.6, 1, -150);
  const tmp = [];
  t.heroes.slice(0, 2).forEach((fn, k) => { const o = fn(t.night); const b = new THREE.Box3().setFromObject(o); const dep = b.max.z - b.min.z; const side = k ? 1 : -1;
    if (o.userData.far) o.position.set(side * 160, GY, -300); else o.position.set(side * (12 + dep / 2 + 6), GY, k ? -190 : -85); o.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; sc.add(o); tmp.push(o); });
  const fl = t.fillers(); for (let k = 0; k < 8; k++) { const o = fl[k % fl.length].clone(); o.position.set((k % 2 ? 1 : -1) * rand(14, 40), GY, -20 - k * 22); sc.add(o); }
  tmp.push(...fl);
  const cam = new THREE.PerspectiveCamera(58, 352 / 242, .5, 1800); cam.position.set(4, 7, 26); cam.lookAt(-6, 12, -80);
  thumbR.render(sc, cam); const url = thumbR.domElement.toDataURL('image/jpeg', .85);
  sc.traverse(n => { if (n.geometry) n.geometry.dispose(); });
  thumbCache[i] = url; return url;
}
let thumbBusy = false;
function thumbQueue() {
  if (thumbBusy) return; thumbBusy = true;
  const step = () => { const c = $$('.tcard').find(c => c.querySelector('img').hidden); if (!c) { thumbBusy = false; return; } const img = c.querySelector('img'); img.src = thumbFor(+c.dataset.t); img.hidden = false; c.querySelector('.ph').remove(); setTimeout(step, 16); };
  step();
}

/* garage */
let gIdx = 0, gTab = 'bikes';
function openGarage(tab = 'bikes') {
  gTab = tab; gIdx = SKINS.findIndex(s => s.id === save.skin); scene.remove(bike.root); gScene.add(bike.root); G.state = 'garage'; showScreen('garage'); renderGarage();
}
function closeGarage() { gScene.remove(bike.root); scene.add(bike.root); bike.root.rotation.y = 0; applySkin(bike, skinById(save.skin)); goHome(); }
function renderGarage() {
  const s = SKINS[gIdx]; applySkin(bike, s); $('#gName').textContent = s.name.toUpperCase(); refreshWallet();
  $('#gStats').innerHTML = ['SPEED', 'HANDLING', 'BOOST'].map((l, i) => `<span>${l}</span><div class="sb"><i style="width:${s.stats[i]}%"></i></div><span class="v">${s.stats[i]}</span>`).join('');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === gTab));
  const act = $('#gAction');
  if (gTab === 'bikes') {
    $('#gBody').innerHTML = `<div class="skins">${SKINS.map((k, i) => `<button class="skin ${i === gIdx ? 'on' : ''}" data-s="${i}">${bikeSilhouette(k.accent)}<b>${k.name}</b>${save.owned.includes(k.id) ? `<span class="own">${k.id === save.skin ? 'EQUIPPED' : 'OWNED'}</span>` : `<span>${ICON.coin}${fmt(k.price)}</span>`}</button>`).join('')}</div>`;
    $$('[data-s]').forEach(b => b.onclick = () => { Snd.click(); gIdx = +b.dataset.s; renderGarage(); });
    act.hidden = false; act.className = 'btn'; act.disabled = false;
    if (s.id === save.skin) { act.innerHTML = 'EQUIPPED'; act.disabled = true; }
    else if (save.owned.includes(s.id)) { act.innerHTML = 'EQUIP'; act.classList.add('green'); }
    else { act.innerHTML = `BUY · ${fmt(s.price)}`; act.classList.add('gold'); act.disabled = save.coins < s.price; }
  } else {
    const ups = [['magnet', 'Gold Magnet', 'Pulls coins in'], ['nitro', 'Dust Storm Nitro', 'Smash through traffic'], ['x2', 'Gold Fever', 'Double coins'], ['shield', 'Sheriff Guard', 'Spawns more often']];
    $('#gBody').innerHTML = `<div class="list upg">${ups.map(([k, n, d]) => { const lv = save.upg[k], cost = 400 * (lv + 1) ** 2;
      return `<div class="li" style="padding:1.8cqw 2.4cqw"><div class="ic">${ICON[PU[k].icon]}</div><div class="tx"><b>${n}</b><span>${d}${k !== 'shield' ? ' · ' + puDur(k).toFixed(1) + ' s' : ''}</span><div class="lv">${[0, 1, 2, 3, 4].map(j => `<i class="${j < lv ? 'on' : ''}"></i>`).join('')}</div></div>
      <button class="mini" data-u="${k}" ${lv >= 5 || save.coins < cost ? 'disabled' : ''} style="${lv >= 5 || save.coins < cost ? 'filter:grayscale(.8) brightness(.7)' : ''}">${lv >= 5 ? 'MAX' : fmt(cost)}</button></div>`; }).join('')}</div>`;
    $$('[data-u]').forEach(b => b.onclick = () => { const k = b.dataset.u, cost = 400 * (save.upg[k] + 1) ** 2; if (save.coins < cost) return; save.coins -= cost; save.upg[k]++; persist(); Snd.cash(); renderGarage(); });
    act.hidden = true;
  }
}
$('#gAction').onclick = () => { const s = SKINS[gIdx]; if (save.owned.includes(s.id)) { save.skin = s.id; } else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(s.id); save.skin = s.id; Snd.cash(); toast(s.name + ' unlocked'); } persist(); renderGarage(); };
$('#gPrev').onclick = () => { gIdx = (gIdx + SKINS.length - 1) % SKINS.length; gTab = 'bikes'; renderGarage(); };
$('#gNext').onclick = () => { gIdx = (gIdx + 1) % SKINS.length; gTab = 'bikes'; renderGarage(); };
$$('.tab').forEach(t => t.onclick = () => { Snd.click(); gTab = t.dataset.tab; renderGarage(); });
$$('[data-back]').forEach(b => b.onclick = () => { Snd.click(); if (G.state === 'garage') closeGarage(); else goHome(); });

function goHome() {
  Snd.engineStop(); clearRunObjects(); P = null; G.state = 'home'; showScreen('home'); refreshWallet();
  $('#count').hidden = true; $('#tut').hidden = true; $('#banner').classList.remove('show');
  bike.body.rotation.set(0, 0, 0); bike.body.position.set(0, 0, 0); streaks.forEach(s => s.visible = false);
}
$('#playBtn').onclick = () => { Snd.init(); Snd.click(); openRaceStart(save.track); };
$('#pauseBtn').onclick = () => pauseGame();
function pauseGame() {
  if (G.state !== 'run') return; G.state = 'paused'; Snd.engineStop();
  openModal(`<h2 class="ptitle chrome-text">PAUSED</h2><div class="btns"><button class="btn green" id="pResume">${ICON.play} RESUME</button><button class="btn" id="pRestart">${ICON.restart} RESTART</button>
    <button class="btn dark" id="pSound">${ICON.sound} SOUND ${save.sound ? 'ON' : 'OFF'}</button><button class="btn red" id="pHome">${ICON.home} EXIT</button></div>`, false);
  $('#pResume').onclick = () => { closeModal(); G.state = 'run'; Snd.engineStart(); };
  $('#pRestart').onclick = () => { closeModal(); G.homeZ = P.z - 30; world.reset(G.homeZ); startRun(); };
  $('#pSound').onclick = () => { Snd.setOn(!save.sound); $('#pSound').innerHTML = `${ICON.sound} SOUND ${save.sound ? 'ON' : 'OFF'}`; };
  $('#pHome').onclick = () => { closeModal(); goHome(); };
}

/* input */
const keymap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ' ': 'up', ArrowDown: 'down', s: 'down', S: 'down' };
window.addEventListener('keydown', e => {
  if (keymap[e.key] && (G.state === 'run')) { e.preventDefault(); action(keymap[e.key]); }
  if ((e.key === 'Escape' || e.key === 'p') && G.state === 'run') pauseGame();
});
let sw = null;
app.addEventListener('pointerdown', e => { Snd.init(); if (G.state === 'run') sw = { x: e.clientX, y: e.clientY, done: false }; if (G.state === 'garage' && (e.target === canvas || e.target.id === 'garage')) { G.dragging = { x: e.clientX }; G.gVel = 0; } });
app.addEventListener('pointermove', e => {
  if (G.dragging) { const dx = e.clientX - G.dragging.x; G.gRot += dx * .012; G.gVel = dx * .6; G.dragging.x = e.clientX; }
  if (!sw || sw.done) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y, th = app.clientWidth * .055;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > th) { sw.done = true; action(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down')); }
});
window.addEventListener('pointerup', () => { sw = null; G.dragging = null; });
window.addEventListener('pointercancel', () => { sw = null; G.dragging = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function applyQuality() {
  const hi = save.quality === 'high';
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, hi ? 2 : 1.25)); renderer.shadowMap.enabled = hi; world.sun.castShadow = hi;
  scene.traverse(n => { if (n.material && n.material.needsUpdate !== undefined) n.material.needsUpdate = true; }); resize();
}
function resize() { const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(app);

/* =========================================================
   Loop
   ========================================================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; G.t += dt;
  for (const p of parts) if (p.life > 0) { p.life -= dt; p.v.y -= 18 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = clamp(p.life * 2, 0, 1); if (p.life <= 0) p.m.visible = false; }
  if (G.state === 'home' || G.state === 'tracks') updateHome(dt);
  else if (G.state === 'countdown') {
    G.count -= dt; const n = Math.ceil(G.count / .6);
    if (n !== G.lastCount) { G.lastCount = n; $('#count').innerHTML = `<b>${n > 0 ? n : 'GO!'}</b>`; if (n > 0) Snd.tone(520, .12, 'square', .08); else Snd.tone(1040, .25, 'square', .1); }
    bike.root.position.set(0, 0, P.z); bike.body.rotation.set(0, 0, 0); world.update(P.z, dt); bike.wheels.forEach(w => w.rotation.x -= dt * 4);
    G.fovT = 60; setCam(V(0, 3.15, P.z + 6.4), V(0, 1.25, P.z - 8), dt, 3);
    if (G.count <= -.35) { G.state = 'run'; $('#count').hidden = true; setTimeout(() => $('#banner').classList.remove('show'), 1200);
      if (!save.tutorial) setTimeout(() => { $('#tut').style.opacity = 0; setTimeout(() => $('#tut').hidden = true, 500); save.tutorial = true; persist(); }, 3500); }
  }
  else if (G.state === 'run') updateRun(dt);
  else if (G.state === 'paused' || G.state === 'over') { if (P && !P.alive && G.state === 'over') { /* frozen */ } }
  if (G.state === 'garage') { updateGarage(dt); renderer.render(gScene, camera); }
  else renderer.render(scene, camera);
}

/* boot */
async function boot() {
  const bar = $('#loadbar'), txt = $('#loadtxt');
  bar.style.width = '25%'; await new Promise(r => setTimeout(r, 30));
  world.setTheme(theme()); bar.style.width = '65%'; txt.textContent = 'TUNING ENGINE';
  G.homeZ = 0; world.reset(0); applyQuality();
  bar.style.width = '100%'; await new Promise(r => setTimeout(r, 250));
  camera.position.set(-2.5, 1.45, 4.3); G.state = 'home'; $('#loading').hidden = true; showScreen('home'); refreshWallet();
  requestAnimationFrame(frame);
}
boot();
</script>
