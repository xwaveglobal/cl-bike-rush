<title>Sky Bike Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-shaped stage; toon WebGL world underneath, comic-book panels and stickers on top. Style C · Comic Speed. */
:root{
  --ink:#141414; --paper:#fff8e1; --yel:#ffd60a; --red:#ff3b30; --blue:#1c6fe8; --cyan:#3fd0ff; --grn:#19c26b; --orange:#ff8a1f; --mut:#5b5b5b;
  --f-display:'Bangers','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Rubik','Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:#1b1b1b}
body{height:100%;margin:0;background:#1b1b1b;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:relative;height:100%;aspect-ratio:9/18;max-width:100%;margin:0 auto;overflow:hidden;container-type:size;touch-action:none;background:#3fb6ff}
#app.garage-mode{background:repeating-conic-gradient(from 0deg at 50% 30%,#ffd60a 0 7deg,#ffe766 7deg 14deg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;z-index:5}
button{font:inherit;color:inherit}
.comicbg{background:repeating-conic-gradient(from 0deg at 50% 40%,#ffd60a 0 7deg,#ffe35a 7deg 14deg)}
.comicbg::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,120,0,.28) 1.1cqw,transparent 1.3cqw);background-size:3.4cqw 3.4cqw;-webkit-mask-image:radial-gradient(circle at 50% 40%,transparent 30%,#000 75%);mask-image:radial-gradient(circle at 50% 40%,transparent 30%,#000 75%)}

/* ---------- logo ---------- */
.logo{font-family:var(--f-display);line-height:.84;pointer-events:none}
.logo .l1{display:block;font-size:var(--ls,17cqw);letter-spacing:.03em;color:var(--yel);-webkit-text-stroke:calc(var(--ls,17cqw)*.13) var(--ink);paint-order:stroke fill;text-shadow:1.4cqw 1.4cqw 0 var(--red)}
.logo .l2{display:inline-block;margin-top:1cqw;font-size:calc(var(--ls,17cqw)*.48);letter-spacing:.08em;color:#fff;background:var(--red);border:.9cqw solid var(--ink);padding:0 4cqw;transform:skewX(-14deg);box-shadow:1.2cqw 1.2cqw 0 var(--ink)}

/* ---------- loading ---------- */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8cqw;z-index:40}
#loading .logo{position:relative;text-align:center;transform:rotate(-6deg)}
.bar{position:relative;width:64cqw;height:5cqw;background:#fff;border:.9cqw solid var(--ink);transform:skewX(-12deg);box-shadow:1.2cqw 1.2cqw 0 var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--red) 0 2.4cqw,#ff6a5f 2.4cqw 4.8cqw);transition:width .2s}
.loadtxt{position:relative;font:5cqw var(--f-display);letter-spacing:.12em;color:#fff;-webkit-text-stroke:1cqw var(--ink);paint-order:stroke fill}

/* ---------- small parts ---------- */
.pill{flex:none;display:flex;align-items:center;gap:.8cqw;height:8cqw;padding:0 .8cqw 0 1cqw;background:#fff;border:.7cqw solid var(--ink);box-sizing:border-box;transform:skewX(-10deg);box-shadow:.8cqw .8cqw 0 var(--ink)}
.pill>*{transform:skewX(10deg)}
.pill svg.ico{width:5.8cqw;height:5.8cqw}
.pill b{font:800 3.6cqw var(--f-body);font-variant-numeric:tabular-nums;min-width:9cqw;text-align:right}
.plus{all:unset;cursor:pointer;width:5.4cqw;height:5.4cqw;display:grid;place-items:center;background:var(--grn);border:.5cqw solid var(--ink);box-sizing:border-box}
.plus svg{width:80%}
.sqbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:9.6cqw;height:9.6cqw;display:grid;place-items:center;background:#fff;border:.8cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink);transition:transform .08s}
.sqbtn svg{width:72%}
.sqbtn:active{transform:translate(.6cqw,.6cqw);box-shadow:.3cqw .3cqw 0 var(--ink)}
.sqbtn.y{background:var(--yel)}
.badge{position:absolute;top:-1.8cqw;right:-1.8cqw;z-index:2;width:6.4cqw;height:6.4cqw;display:grid;place-items:center;pointer-events:none;color:#fff;font:4.4cqw/1 var(--f-display);
  background:var(--red);clip-path:polygon(50% 0,62% 26%,92% 14%,80% 42%,100% 58%,72% 66%,76% 96%,50% 80%,24% 96%,28% 66%,0 58%,20% 42%,8% 14%,38% 26%)}
button:focus-visible,.profile:focus-visible{outline:.8cqw solid var(--blue);outline-offset:.6cqw}

/* ---------- buttons ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;gap:1.8cqw;height:12.4cqw;padding:0 5.6cqw;
  font:7cqw var(--f-display);letter-spacing:.07em;color:#fff;-webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;
  background:var(--blue);border:.9cqw solid var(--ink);box-shadow:1.3cqw 1.3cqw 0 var(--ink);transform:skewX(-10deg);transition:transform .08s,box-shadow .08s}
.btn svg{width:6cqw;height:6cqw;transform:skewX(10deg)}
.btn:active{transform:skewX(-10deg) translate(.8cqw,.8cqw);box-shadow:.5cqw .5cqw 0 var(--ink)}
.btn.y{background:var(--yel);color:var(--red)}
.btn.g{background:var(--grn)}
.btn.r{background:var(--red)}
.btn.w{background:#fff;color:var(--ink);-webkit-text-stroke:0}
.btn.sm{height:10.4cqw;font-size:5.4cqw;padding:0 3.6cqw}
.btn[disabled]{background:#d9d4c3;color:#8f8a7a;-webkit-text-stroke:0;border-color:#8f8a7a;box-shadow:1.3cqw 1.3cqw 0 #8f8a7a;pointer-events:none}

/* ---------- home ---------- */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:1.6cqw;padding:calc(env(safe-area-inset-top,0px) + 3cqw) 3cqw 0}
.profile{display:flex;align-items:center;gap:1.6cqw;flex:1 1 0;min-width:0;cursor:pointer}
.avatar{flex:none;width:11.6cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--yel);border:.9cqw solid var(--ink);box-sizing:border-box;overflow:hidden}
.avatar svg{width:78%}
.pinfo{min-width:0;flex:1;line-height:1}
.pname{font:5cqw var(--f-display);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1cqw var(--ink);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{display:inline-block;margin-top:.6cqw;font:800 2.7cqw var(--f-body);color:#fff;background:var(--ink);padding:.2cqw 1.6cqw;transform:skewX(-10deg)}
.xp{height:1.5cqw;margin-top:.8cqw;background:#fff;border:.4cqw solid var(--ink);overflow:hidden;transform:skewX(-10deg)}
.xp i{display:block;height:100%;background:var(--grn)}
.menuwrap{position:relative;flex:none}
#home .logo{position:absolute;left:5cqw;top:calc(env(safe-area-inset-top,0px) + 17cqw);transform:rotate(-7deg);--ls:15cqw}
.stickers{position:absolute;right:3.4cqw;top:calc(env(safe-area-inset-top,0px) + 18cqw);display:flex;flex-direction:column;gap:4.6cqw}
.sticker{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:.6cqw;width:19cqw}
.sticker .disc{width:16.5cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;border:.9cqw solid var(--ink);box-sizing:border-box;box-shadow:1cqw 1cqw 0 var(--ink);transition:transform .08s}
.sticker .disc svg{width:66%}
.sticker:nth-child(1) .disc{background:var(--yel);transform:rotate(-8deg)}
.sticker:nth-child(2) .disc{background:var(--cyan);transform:rotate(6deg)}
.sticker:active .disc{transform:scale(.92)}
.sticker .lbl{font:4.4cqw var(--f-display);letter-spacing:.06em;color:#fff;-webkit-text-stroke:.9cqw var(--ink);paint-order:stroke fill}
.sticker .badge{top:-1cqw;right:.4cqw}
.caption{all:unset;cursor:pointer;position:absolute;left:5cqw;right:5cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 33cqw);display:flex;align-items:center;gap:2.4cqw;padding:2cqw 3cqw;
  background:var(--paper);border:.9cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink);transform:rotate(-1.5deg);box-sizing:border-box}
.caption svg{flex:none;width:8cqw}
.caption .t{flex:1;min-width:0;line-height:1.05}
.caption small{display:block;font:800 2.6cqw var(--f-body);letter-spacing:.18em;color:var(--red)}
.caption b{display:block;font:6.4cqw var(--f-display);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption .t>span{font:700 3cqw var(--f-body);color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption em{flex:none;font:4.2cqw var(--f-display);font-style:normal;letter-spacing:.06em;color:#fff;background:var(--blue);border:.6cqw solid var(--ink);padding:.6cqw 2.2cqw;transform:skewX(-10deg)}
.botrow{position:absolute;left:4cqw;right:4cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 5cqw);display:grid;grid-template-columns:19cqw minmax(0,1fr) 19cqw;gap:3.4cqw;align-items:end}
.sqbig{all:unset;box-sizing:border-box;cursor:pointer;position:relative;height:21cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;
  background:#fff;border:.9cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink);transform:skewX(-8deg);transition:transform .08s,box-shadow .08s}
.sqbig svg{width:10cqw;transform:skewX(8deg)}
.sqbig .lbl{font:4.4cqw var(--f-display);letter-spacing:.06em;transform:skewX(8deg)}
.sqbig:active{transform:skewX(-8deg) translate(.8cqw,.8cqw);box-shadow:.4cqw .4cqw 0 var(--ink)}
.sqbig.b{background:var(--blue);color:#fff}
.sqbig.b .lbl{-webkit-text-stroke:.8cqw var(--ink);paint-order:stroke fill}
.play{all:unset;box-sizing:border-box;cursor:pointer;height:23cqw;display:grid;place-items:center;background:var(--yel);border:1.1cqw solid var(--ink);box-shadow:1.8cqw 1.8cqw 0 var(--ink);
  font:15cqw var(--f-display);letter-spacing:.06em;color:var(--red);-webkit-text-stroke:1cqw var(--ink);paint-order:stroke fill;transform:skewX(-12deg) rotate(-3deg);animation:wobble 1.6s ease-in-out infinite;transition:box-shadow .08s}
.play:active{box-shadow:.6cqw .6cqw 0 var(--ink)}
@keyframes wobble{0%,100%{transform:skewX(-12deg) rotate(-3deg) scale(1)}50%{transform:skewX(-12deg) rotate(-1deg) scale(1.04)}}

/* ---------- sub screens ---------- */
.subhead{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:2.6cqw;padding:calc(env(safe-area-inset-top,0px) + 3cqw) 3.4cqw 3cqw}
.subhead h2{flex:1;margin:0;font:9cqw/1 var(--f-display);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.6cqw var(--ink);paint-order:stroke fill;text-shadow:1cqw 1cqw 0 var(--red);transform:rotate(-2deg);text-wrap:balance}
.subhead h2 small{display:block;margin-top:.8cqw;font:800 2.8cqw var(--f-body);letter-spacing:.18em;color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.tgrid{position:absolute;inset:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4cqw 3.6cqw;align-content:start;
  padding:calc(env(safe-area-inset-top,0px) + 25cqw) 4.4cqw calc(env(safe-area-inset-bottom,0px) + 6cqw);touch-action:pan-y;scrollbar-width:thin}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;background:#fff;border:.8cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink);transition:transform .08s}
.tcard:nth-child(4n+1){transform:rotate(-1.2deg)}.tcard:nth-child(4n+2){transform:rotate(1deg)}.tcard:nth-child(4n+3){transform:rotate(.8deg)}.tcard:nth-child(4n){transform:rotate(-.8deg)}
.tcard .in{position:relative;aspect-ratio:16/11;overflow:hidden;background:#3fb6ff;border-bottom:.8cqw solid var(--ink)}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.tcard .no{position:absolute;top:1.2cqw;left:1.2cqw;font:4cqw var(--f-display);color:#fff;background:var(--ink);padding:.2cqw 1.6cqw;transform:skewX(-10deg)}
.tcard .stars{position:absolute;top:1.2cqw;right:1.2cqw;font:3.4cqw var(--f-display);color:var(--yel);-webkit-text-stroke:.7cqw var(--ink);paint-order:stroke fill;letter-spacing:.02em}
.tcard .meta{padding:1.6cqw 2.2cqw 2cqw}
.tcard .tn{font:5cqw/1 var(--f-display);letter-spacing:.04em}
.tcard .ts{margin-top:.4cqw;font:700 2.7cqw/1.2 var(--f-body);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .best{margin-top:.6cqw;font:800 2.7cqw var(--f-body);color:var(--blue);font-variant-numeric:tabular-nums;min-height:3.3cqw}
.tcard.sel{background:var(--yel);box-shadow:1.2cqw 1.2cqw 0 var(--red)}
.tcard.sel::after{content:"PICKED!";position:absolute;bottom:-2.6cqw;right:-1.6cqw;font:4.2cqw var(--f-display);color:#fff;background:var(--red);border:.6cqw solid var(--ink);padding:0 2cqw;transform:rotate(-8deg)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:4cqw var(--f-display);color:#fff;-webkit-text-stroke:.8cqw var(--ink);paint-order:stroke fill;letter-spacing:.1em}

/* ---------- modal panels ---------- */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:6cqw;background:rgba(20,20,20,.55)}
.panel{position:relative;width:100%;max-height:88cqh;background:var(--paper);border:1.1cqw solid var(--ink);box-shadow:2cqw 2cqw 0 var(--ink);transform:rotate(-1deg);animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(28,111,232,.12) .9cqw,transparent 1.1cqw);background-size:3.2cqw 3.2cqw}
.panel>.in{position:relative;max-height:calc(88cqh - 2.2cqw);overflow-y:auto;touch-action:pan-y;padding:6cqw 5cqw 5.4cqw;display:flex;flex-direction:column;gap:3.6cqw}
@keyframes pop{from{transform:rotate(-1deg) scale(.6);opacity:0}}
.ptitle{margin:0 9cqw;text-align:center;font:11cqw/1 var(--f-display);letter-spacing:.06em;color:var(--yel);-webkit-text-stroke:2cqw var(--ink);paint-order:stroke fill;text-shadow:1.2cqw 1.2cqw 0 var(--red);transform:rotate(-3deg) skewX(-8deg);text-wrap:balance}
.psub{text-align:center;font:700 3.4cqw var(--f-body);color:var(--mut);margin-top:-1cqw}
.close{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:2.4cqw;right:2.4cqw;z-index:2;width:10cqw;height:10cqw;border-radius:50%;display:grid;place-items:center;background:var(--red);border:.8cqw solid var(--ink);box-shadow:.7cqw .7cqw 0 var(--ink)}
.close svg{width:62%}
.mascot{display:grid;place-items:center}
.mascot svg{width:30cqw}
.list{display:flex;flex-direction:column;gap:2.4cqw}
.li{display:flex;align-items:center;gap:2.6cqw;padding:2.2cqw 2.6cqw;background:#fff;border:.7cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink)}
.li .ic{flex:none;width:9.4cqw;height:9.4cqw;display:grid;place-items:center}
.li .ic svg{width:100%}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font:5cqw/1.05 var(--f-display);letter-spacing:.04em}
.li .tx span{display:block;font:600 3cqw/1.25 var(--f-body);color:var(--mut)}
.li .prog{height:2cqw;margin-top:1cqw;background:#eee;border:.45cqw solid var(--ink);overflow:hidden;transform:skewX(-10deg)}
.li .prog i{display:block;height:100%;background:var(--grn)}
.li.me{background:var(--yel)}
.btns{display:flex;flex-direction:column;gap:3.4cqw;align-items:stretch;padding:0 1.4cqw}
.btns.row{flex-direction:row}
.btns.row>*{flex:1;padding:0 2cqw}
.mini{all:unset;box-sizing:border-box;cursor:pointer;flex:none;padding:1cqw 3cqw;font:4.6cqw var(--f-display);letter-spacing:.06em;color:#fff;-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;
  background:var(--grn);border:.6cqw solid var(--ink);box-shadow:.7cqw .7cqw 0 var(--ink);transform:skewX(-10deg);white-space:nowrap}
.mini.b{background:var(--blue)}
.mini.r{background:var(--red)}
.mini.gray{background:#d9d4c3;color:#8f8a7a;-webkit-text-stroke:0}
.mini[disabled]{background:#d9d4c3;color:#8f8a7a;-webkit-text-stroke:0;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3.4cqw}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:3cqw 1cqw 2.4cqw;background:#fff;border:.8cqw solid var(--ink);box-shadow:1cqw 1cqw 0 var(--ink);transition:transform .08s}
.tile:nth-child(odd){transform:rotate(-2deg)}.tile:nth-child(even){transform:rotate(1.6deg)}
.tile:active{transform:scale(.94)}
.tile svg{width:12cqw}
.tile b{font:4.4cqw var(--f-display);letter-spacing:.05em;text-align:center}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4cqw}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:.6cqw;padding:1.8cqw .6cqw;background:#fff;border:.6cqw solid var(--ink);font:4cqw var(--f-display);letter-spacing:.03em}
.day svg{width:8.4cqw}
.day small{font:800 2.4cqw var(--f-body);letter-spacing:.1em;color:var(--mut)}
.day.done{opacity:.4}
.day.today{background:var(--yel);box-shadow:.9cqw .9cqw 0 var(--red);transform:rotate(-3deg)}
.day.big{grid-column:span 2}
.rs-thumb{position:relative;aspect-ratio:16/10;overflow:hidden;border:.9cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink);background:#3fb6ff}
.rs-thumb img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.rs-thumb .cap{position:absolute;left:2cqw;bottom:2cqw;max-width:80%;padding:1cqw 2.4cqw;background:var(--paper);border:.6cqw solid var(--ink);transform:rotate(-2deg)}
.rs-thumb .cap b{display:block;font:6.4cqw/1 var(--f-display);letter-spacing:.04em}
.rs-thumb .cap span{font:700 2.9cqw var(--f-body);color:var(--mut)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6cqw}
.mode{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:1.8cqw .6cqw;font:5.4cqw/1 var(--f-display);letter-spacing:.05em;color:#fff;-webkit-text-stroke:.6cqw var(--ink);paint-order:stroke fill;border:.7cqw solid var(--ink);display:flex;flex-direction:column;gap:.6cqw;transform:skewX(-8deg);transition:transform .1s}
.mode small{font:800 2.5cqw var(--f-body);-webkit-text-stroke:0;color:#fff}
.mode.easy{background:var(--grn)}.mode.normal{background:var(--blue)}.mode.hard{background:var(--red)}
.mode.on{box-shadow:1cqw 1cqw 0 var(--ink);transform:skewX(-8deg) translateY(-1cqw) scale(1.04)}
.mode:not(.on){opacity:.5}
.kv{display:flex;justify-content:space-between;gap:2cqw;font:700 3.5cqw var(--f-body);color:var(--mut)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- garage ---------- */
.gname{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 24cqw);display:flex;align-items:center;justify-content:center;gap:3cqw}
.gname b{min-width:50cqw;text-align:center;font:8cqw var(--f-display);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.4cqw var(--ink);paint-order:stroke fill;transform:rotate(-2deg)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:4.6cqw 4cqw calc(env(safe-area-inset-bottom,0px) + 4.6cqw);display:flex;flex-direction:column;gap:3cqw;background:var(--paper);border-top:1.1cqw solid var(--ink)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:1.4cqw 2.6cqw;align-items:center;font:4cqw var(--f-display);letter-spacing:.08em}
.stats .sb{height:2.8cqw;background:#fff;border:.5cqw solid var(--ink);overflow:hidden;transform:skewX(-12deg)}
.stats .sb i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--red) 0 1.6cqw,#ff6a5f 1.6cqw 3.2cqw);transition:width .3s}
.stats .v{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2.6cqw}
.tab{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:1.4cqw 0;font:5cqw var(--f-display);letter-spacing:.06em;background:#fff;border:.7cqw solid var(--ink);transform:skewX(-10deg)}
.tab.on{background:var(--ink);color:var(--yel)}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4cqw}
.skin{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:.2cqw;padding:1.4cqw .4cqw 1.2cqw;background:#fff;border:.6cqw solid var(--ink)}
.skin svg.bk{width:15cqw;height:9cqw}
.skin b{font:3.2cqw/1 var(--f-display);letter-spacing:.03em;text-align:center}
.skin span{font:800 2.5cqw var(--f-body);color:var(--orange);display:flex;align-items:center;gap:.6cqw}
.skin span svg{width:3cqw;height:3cqw}
.skin span.own{color:var(--grn)}
.skin.on{background:var(--yel);box-shadow:.9cqw .9cqw 0 var(--red);transform:rotate(-2deg)}
.upg .lv{display:flex;gap:1cqw;margin-top:1cqw}
.upg .lv i{flex:1;height:2cqw;background:#eee;border:.4cqw solid var(--ink);transform:skewX(-12deg)}
.upg .lv i.on{background:var(--grn)}

/* ---------- HUD ---------- */
#speed{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s;
  background:repeating-conic-gradient(from 0deg at 50% 44%,transparent 0 2.6deg,rgba(255,255,255,.7) 2.6deg 3.1deg,transparent 3.1deg 7deg);
  -webkit-mask-image:radial-gradient(circle at 50% 44%,transparent 32%,#000 78%);mask-image:radial-gradient(circle at 50% 44%,transparent 32%,#000 78%)}
#hud{pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:2.4cqw;padding:calc(env(safe-area-inset-top,0px) + 3cqw) 3.4cqw 0}
#hud .sqbtn{pointer-events:auto}
.hpill{display:flex;align-items:center;gap:1.4cqw;height:9cqw;padding:0 3.4cqw 0 2.4cqw;background:var(--ink);color:#fff;font:6.4cqw var(--f-display);letter-spacing:.06em;font-variant-numeric:tabular-nums;transform:skewX(-10deg);box-shadow:1cqw 1cqw 0 var(--red)}
.hpill>*{transform:skewX(10deg)}
.hpill svg{width:6cqw;height:6cqw}
.hpill small{font-size:4cqw}
.hpill.coin{margin-left:auto;box-shadow:1cqw 1cqw 0 var(--yel)}
.hpill.coin.bump{animation:bump .18s}
@keyframes bump{50%{transform:skewX(-10deg) scale(1.14)}}
.speedo{position:absolute;left:3.4cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 4cqw);width:23cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 225deg,var(--red) calc(var(--p,0)*75%),#fff 0 75%,transparent 0);border:.9cqw solid var(--ink);box-sizing:border-box}
.speedo .in{width:76%;aspect-ratio:1;border-radius:50%;background:var(--yel);border:.7cqw solid var(--ink);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center}
.speedo b{font:8cqw/1 var(--f-display);font-variant-numeric:tabular-nums}
.speedo small{font:800 2.2cqw var(--f-body);letter-spacing:.1em}
.pups{position:absolute;right:3.4cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 4cqw);display:flex;gap:2.4cqw}
.pu{width:13.6cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--t)*100%),#fff 0);border:.8cqw solid var(--ink);box-sizing:border-box}
.pu .in{width:78%;aspect-ratio:1;border-radius:50%;background:#fff;border:.5cqw solid var(--ink);box-sizing:border-box;display:grid;place-items:center}
.pu svg{width:70%}
.banner{position:absolute;left:0;right:0;top:26cqh;text-align:center;pointer-events:none;opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .3s,transform .3s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:scale(1) rotate(-4deg)}
.banner b{display:inline-block;font:10cqw var(--f-display);letter-spacing:.05em;color:var(--yel);-webkit-text-stroke:1.8cqw var(--ink);paint-order:stroke fill;text-shadow:1.2cqw 1.2cqw 0 var(--red)}
.banner span{display:block;width:max-content;max-width:90cqw;margin:1.4cqw auto 0;padding:.4cqw 3cqw;font:4cqw var(--f-display);letter-spacing:.12em;color:#fff;background:var(--ink);transform:skewX(-10deg)}
#count{position:absolute;inset:0;z-index:12;display:grid;place-items:center;pointer-events:none}
#count b{font:36cqw var(--f-display);color:var(--yel);-webkit-text-stroke:3cqw var(--ink);paint-order:stroke fill;text-shadow:2.4cqw 2.4cqw 0 var(--red);animation:cnt .6s ease-out both}
@keyframes cnt{from{transform:scale(2) rotate(-14deg);opacity:0}30%{transform:scale(1) rotate(-6deg);opacity:1}to{transform:scale(.85) rotate(-4deg);opacity:.2}}
#tut{position:absolute;left:6cqw;right:6cqw;top:42cqh;z-index:11;pointer-events:none;display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;padding:4cqw;background:var(--paper);border:.9cqw solid var(--ink);box-shadow:1.4cqw 1.4cqw 0 var(--ink);transform:rotate(-1.5deg);transition:opacity .5s}
#tut div{display:flex;align-items:center;gap:2cqw;font:700 3.4cqw var(--f-body)}
#tut kbd{flex:none;width:9cqw;height:9cqw;display:grid;place-items:center;font:5cqw var(--f-display);color:#fff;background:var(--blue);border:.6cqw solid var(--ink);transform:skewX(-10deg)}
#pops{position:absolute;inset:0;z-index:13;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:30cqh;font:13cqw var(--f-display);letter-spacing:.04em;color:var(--yel);-webkit-text-stroke:2cqw var(--ink);paint-order:stroke fill;text-shadow:1.4cqw 1.4cqw 0 var(--red);white-space:nowrap;animation:popfx .9s cubic-bezier(.2,1.6,.4,1) both}
.pop.small{font-size:8cqw;-webkit-text-stroke:1.4cqw var(--ink)}
@keyframes popfx{0%{transform:translate(-50%,0) scale(.2) rotate(var(--r,-8deg));opacity:0}25%{transform:translate(-50%,0) scale(1.1) rotate(var(--r,-8deg));opacity:1}70%{opacity:1}100%{transform:translate(-50%,-14cqw) scale(1) rotate(var(--r,-8deg));opacity:0}}

/* result */
.reswrap{display:grid;grid-template-columns:1fr auto;gap:3cqw;align-items:center}
.res-big small{display:block;font:800 3cqw var(--f-body);letter-spacing:.2em;color:var(--mut)}
.res-big b{display:block;font:14cqw/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;margin-top:1cqw;padding:.4cqw 2.6cqw;font:5cqw var(--f-display);letter-spacing:.06em;color:#fff;background:var(--red);border:.6cqw solid var(--ink);transform:rotate(-6deg)}
.rank{position:relative;width:24cqw;aspect-ratio:1;display:grid;place-items:center;background:var(--yel);
  clip-path:polygon(50% 0,61% 22%,85% 12%,80% 37%,100% 50%,80% 63%,85% 88%,61% 78%,50% 100%,39% 78%,15% 88%,20% 63%,0 50%,20% 37%,15% 12%,39% 22%)}
.rank b{font:14cqw/1 var(--f-display);color:var(--red);-webkit-text-stroke:1.4cqw var(--ink);paint-order:stroke fill}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40cqh);z-index:50;transform:translate(-50%,2cqw) rotate(-2deg);max-width:84cqw;text-align:center;
  padding:2.2cqw 5cqw;border-radius:8cqw;background:#fff;border:.9cqw solid var(--ink);font:6cqw var(--f-display);letter-spacing:.05em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast::after{content:"";position:absolute;left:18%;bottom:-3.8cqw;width:5cqw;height:3.6cqw;background:var(--ink);clip-path:polygon(0 0,100% 0,0 100%)}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-2deg)}
@media (prefers-reduced-motion:reduce){.play{animation:none}.panel{animation:none}.pop{animation-duration:.01s}}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

/* =========================================================
   Utilities, save, audio
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.floor(n).toLocaleString('en-US');
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = new THREE.Vector3(0, 1, 0);
const today = () => new Date().toISOString().slice(0, 10);

const SAVE_KEY = 'skybikerun.preview.v1';
const DEFAULT_SAVE = { coins: 2500, gems: 120, best: 0, owned: ['blue'], skin: 'blue', track: 0, mode: 'normal', xp: 0, runs: 0,
  totalCoins: 0, dailyDay: 0, dailyLast: '', upg: { magnet: 0, shield: 0, nitro: 0, x2: 0 }, trackBest: {}, sound: true,
  quality: 'high', tutorial: false, claimed: {}, name: 'Rider' + String(Math.floor(rand(100, 999))) };
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
const save = Object.assign(structuredClone(DEFAULT_SAVE), loadSave());
save.upg = Object.assign({ magnet: 0, shield: 0, nitro: 0, x2: 0 }, save.upg);
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage off: keep playing */ } }

const Snd = {
  ctx: null, master: null, eng: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = save.sound ? 0.5 : 0; this.master.connect(this.ctx.destination); }
    catch (e) { this.ctx = null; }
  },
  tone(f, d = .1, type = 'sine', v = .2, slide = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime; const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .03);
  },
  noise(d = .4, v = .3, freq = 900) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    const b = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * d), this.ctx.sampleRate); const ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = this.ctx.createBufferSource(); s.buffer = b; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = v; s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  coin() { this.tone(1320, .07, 'square', .05); setTimeout(() => this.tone(1980, .09, 'square', .045), 40); },
  jump() { this.tone(260, .22, 'triangle', .16, 520); },
  slide() { this.noise(.28, .16, 2400); },
  crash() { this.noise(.7, .55, 700); this.tone(140, .5, 'sawtooth', .18, -90); },
  pow() { this.noise(.25, .35, 1400); this.tone(200, .2, 'square', .1, -120); },
  power() { [660, 880, 1100, 1480].forEach((f, i) => setTimeout(() => this.tone(f, .12, 'triangle', .13), i * 55)); },
  click() { this.tone(880, .05, 'triangle', .1); },
  boing() { this.tone(300, .18, 'sine', .14, 400); },
  cash() { [990, 1320].forEach((f, i) => setTimeout(() => this.tone(f, .1, 'square', .05), i * 70)); },
  engineStart() {
    if (!this.ctx || this.eng) return;
    const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 60; o2.frequency.value = 30; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = .035;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o.start(); o2.start(); this.eng = { o, o2, g };
  },
  engineSet(sp) { if (this.eng) { const t = this.ctx.currentTime; this.eng.o.frequency.setTargetAtTime(42 + sp * 2.1, t, .12); this.eng.o2.frequency.setTargetAtTime(21 + sp * 1.05, t, .12); } },
  engineStop() { if (this.eng) { try { this.eng.o.stop(); this.eng.o2.stop(); } catch (e) {} this.eng = null; } },
  setOn(on) { save.sound = on; persist(); if (this.master) this.master.gain.value = on ? .5 : 0; }
};

/* =========================================================
   Comic icons (inline SVG, black ink outlines)
   ========================================================= */
const K = '#141414';
const ds = (d, w = 5, c = '#fff') => `<path d="${d}" fill="none" stroke="${K}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const sv = inner => `<svg viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;
const ICON = {
  coin: sv(`<circle cx="24" cy="24" r="20" fill="#ffd60a" stroke="${K}" stroke-width="3.5"/><circle cx="24" cy="24" r="13.5" fill="none" stroke="#e0a500" stroke-width="3"/><path d="M24 14.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L24 29.1l-5.9 3.2 1.3-6.5-4.9-4.5 6.6-.8z" fill="#fff6c2" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`),
  gem: sv(`<path d="M24 4l18 15-18 25L6 19z" fill="#3fd0ff" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><path d="M6 19h36M24 4l-7 15 7 25 7-25z" fill="none" stroke="${K}" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 13l4-4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`),
  gift: sv(`<rect x="7" y="21" width="34" height="21" fill="#ff3b30" stroke="${K}" stroke-width="3.5"/><rect x="5" y="14" width="38" height="9" fill="#ff6a5f" stroke="${K}" stroke-width="3.5"/><rect x="20.5" y="14" width="7" height="28" fill="#ffd60a" stroke="${K}" stroke-width="3"/><path d="M24 14c-3-8-12-10-12-3 0 4 8 3 12 3zm0 0c3-8 12-10 12-3 0 4-8 3-12 3z" fill="#ffd60a" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>`),
  missions: sv(`<rect x="9" y="7" width="30" height="36" rx="2" fill="#fff" stroke="${K}" stroke-width="3.5"/><rect x="16" y="3.5" width="16" height="8" fill="#ff3b30" stroke="${K}" stroke-width="3"/>${ds('M16 26l6 6 11-12', 4.5, '#19c26b')}`),
  crown: sv(`<path d="M7 36L5 14l11 9 8-15 8 15 11-9-2 22z" fill="#ffd60a" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><rect x="7" y="35" width="34" height="7" fill="#ff8a1f" stroke="${K}" stroke-width="3.5"/><circle cx="24" cy="27" r="3.4" fill="#ff3b30" stroke="${K}" stroke-width="2"/>`),

function makeSkyMat() {
  return new THREE.ShaderMaterial({
    uniforms: { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, sunCol: { value: new THREE.Color() },
      sunDir: { value: V(-.35, .3, -1).normalize() }, night: { value: 0 }, dotPx: { value: 7 } },
    vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: `uniform vec3 top,mid,bot,sunCol,sunDir;uniform float night,dotPx;varying vec3 vP;
      float hsh(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}
      void main(){float y=vP.y;vec3 c=y>0.?mix(mid,top,smoothstep(0.,.5,y)):mix(mid,bot,clamp(-y*5.,0.,1.));
      vec2 g=gl_FragCoord.xy/dotPx;float d=length(fract(g)-.5);float r=.36*(1.-smoothstep(0.,.32,abs(y-.04)));
      c=mix(c,c*1.08+.05,step(d,r));
      float s=dot(vP,normalize(sunDir));
      if(s>.9975){c=sunCol;} else if(s>.9962){c=vec3(.08);} else {c+=sunCol*pow(max(s,0.),24.)*.22*(1.-night*.5);}
      if(night>0.){vec3 q=floor(vP*220.);float st=step(.996,hsh(q));c=mix(c,vec3(1.),st*night*smoothstep(.02,.3,y));}
      gl_FragColor=vec4(c,1.);
      #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false });
}

  const open = [0, 1, 2].filter(i => !lanes[i]);
  if (lanes.every(k => k === 'B')) { for (let k = -3; k <= 3; k++) spawnCoin(0, 1 + 1.4 * Math.cos(k / 3 * Math.PI / 2), z - k * 1.6); }

  return gap;
}

   Per-frame updates

function updateRun(dt) {
  if (P.alive) {
    P.speed = lerp(P.speed, speedNow(), Math.min(1, dt * 2)); P.z -= P.speed * dt;
    while (nextRowZ > P.z - 220) nextRowZ -= spawnRow(nextRowZ);
    P.x += (P.lane * LANE - P.x) * Math.min(1, dt * 13);
    if (P.y > 0 || P.vy > 0) { P.vy -= GRAV * dt; P.y += P.vy * dt; if (P.y <= 0) { P.y = 0; P.vy = 0; burst(V(P.x, .1, P.z + .6), '#ffffff', 6, 2.5); } }
    if (P.slide > 0) P.slide -= dt;
    for (const k of ['magnet', 'nitro', 'x2', 'inv']) if (P[k] > 0) P[k] = Math.max(0, P[k] - dt);
    P.wheel += P.speed * dt / .43;
    for (const o of obstacles) {
      if (!o.alive || Math.abs(o.zc - P.z) > o.halfL + .9 || Math.abs(o.x - P.x) > o.halfW + .4) continue;
      const hit = o.kind === 'B' ? P.y < .95 : o.kind === 'G' ? !(P.slide > 0 && P.y < .45) : true; if (!hit) continue;
      if (P.nitro > 0 || P.inv > 0) { smash(o); continue; }
      if (P.shield) { P.shield = false; P.inv = 1.2; smash(o); continue; }
      crash(o); break;
    }
    const mag = P.magnet > 0 || P.nitro > 0;
    for (const c of coins) {
      if (!c.alive) continue; const m = c.mesh; m.rotation.y += dt * 4;
      if (mag) { const dz = m.position.z - P.z; if (dz < 2 && dz > -14) { m.position.x = lerp(m.position.x, P.x, Math.min(1, dt * 9)); m.position.y = lerp(m.position.y, P.y + .9, Math.min(1, dt * 9)); m.position.z = lerp(m.position.z, P.z, Math.min(1, dt * (dz < -6 ? 3 : 9))); } }
      if (Math.abs(m.position.z - P.z) < 1.1 && Math.abs(m.position.x - P.x) < 1.15 && Math.abs(m.position.y - (P.y + .8)) < 1.5) {
        c.alive = false; scene.remove(m); P.coins += P.x2 > 0 ? 2 : 1; Snd.coin(); burst(m.position, '#ffd60a', 3, 2.4);
        const pill = $('#hudCoinPill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
        if (P.coins >= P.nextPop) { pop('KA-CHING! ' + P.nextPop, { small: true, r: 6 }); P.nextPop += 50; }
      }
    }
    for (const p of pups) {
      if (!p.alive) continue; p.mesh.position.y = 1.2 + Math.sin(G.t * 3) * .15;
      if (Math.abs(p.mesh.position.z - P.z) < 1.2 && Math.abs(p.mesh.position.x - P.x) < 1.3 && P.y < 2.6) {
        p.alive = false; scene.remove(p.mesh); Snd.power(); burst(p.mesh.position, PU[p.kind].color, 14, 5); pop(PU[p.kind].label, { small: true });
        if (p.kind === 'shield') P.shield = true; else P[p.kind] = puDur(p.kind);
      }
    }
  } else {
    P.crashT += dt; P.speed = lerp(P.speed, 0, Math.min(1, dt * 3)); P.z -= P.speed * dt * .6;
    bike.body.rotation.x -= dt * 7 * Math.max(0, 1 - P.crashT); bike.body.position.y = Math.max(0, Math.sin(Math.min(1, P.crashT * 1.6) * Math.PI) * 1.6);
    if (P.crashT > 1.3 && G.state === 'run') endRun();
  }
  for (let i = obstacles.length - 1; i >= 0; i--) { const o = obstacles[i];
    if (o.vel) { o.vel.y -= GRAV * dt; o.mesh.position.addScaledVector(o.vel, dt); o.mesh.rotation.x += dt * 5; o.mesh.rotation.z += dt * 3; }
    if (o.zc > P.z + 18 || o.mesh.position.y < -30) { scene.remove(o.mesh); obstacles.splice(i, 1); } }
  for (const a of [coins, pups]) for (let i = a.length - 1; i >= 0; i--) if (!a[i].alive || a[i].mesh.position.z > P.z + 10) { scene.remove(a[i].mesh); a.splice(i, 1); }
  world.update(P.z, dt);
  bike.root.position.set(P.x, P.y, P.z);
  blob.position.set(P.x, .03, P.z); blob.scale.setScalar(clamp(1 - P.y * .15, .45, 1)); blob.visible = true;
  if (P.alive) {
    const lean = clamp((P.lane * LANE - P.x) * -.22, -.5, .5); const sl = P.slide > 0 && P.y < .45 ? 1 : 0;
    P.roll = lerp(P.roll, lean + sl * P.slideSide * 1.05, Math.min(1, dt * 12)); P.pitch = lerp(P.pitch, P.y > 0 ? clamp(P.vy * .025, -.25, .28) : 0, Math.min(1, dt * 10));
    bike.body.rotation.set(P.pitch, 0, P.roll); bike.body.position.y = -sl * .18; bike.rider.position.y = -sl * .12; bike.rider.rotation.x = sl * .25;
  }
  bike.wheels.forEach(w => { w.rotation.x = -P.wheel; });
  bike.flame.visible = P.nitro > 0 && P.alive; if (bike.flame.visible) bike.flame.scale.set(1, rand(.8, 1.4), 1);
  bike.shield.visible = P.shield || P.inv > 0; bike.shield.rotation.y += dt; bike.shield.material.opacity = P.inv > 0 && !P.shield ? .08 + Math.abs(Math.sin(G.t * 12)) * .14 : .22;
  bike.magnet.visible = P.magnet > 0; bike.magnet.scale.setScalar(1 + Math.sin(G.t * 8) * .08);
  Snd.engineSet(P.speed);
  G.fovT = P.nitro > 0 ? 74 : 60 + clamp((P.speed - 24) * .25, 0, 6);
  setCam(V(P.x * .62, 3.15 + P.y * .45, P.z + 6.4), V(P.x * .85, 1.25 + P.y * .55, P.z - 8), dt, 8);
  $('#speed').style.opacity = P.alive ? (P.nitro > 0 ? .9 : clamp((P.speed - 30) / 20, 0, .45)) : 0;
  updateHud();
}
function setCam(pos, look, dt, rate) {
  camera.position.lerp(pos, Math.min(1, dt * rate));
  if (G.camShake > 0) { G.camShake = Math.max(0, G.camShake - dt); camera.position.x += rand(-1, 1) * G.camShake * .5; camera.position.y += rand(-1, 1) * G.camShake * .5; }
  G.look = G.look ? G.look.lerp(look, Math.min(1, dt * rate)) : look.clone(); camera.lookAt(G.look);
  if (Math.abs(camera.fov - G.fovT) > .05) { camera.fov = lerp(camera.fov, G.fovT, Math.min(1, dt * 4)); camera.updateProjectionMatrix(); }
}
function updateHome(dt) {

  bike.root.position.set(.4, 0, z); bike.body.rotation.set(0, 0, Math.sin(G.t * .8) * .05); bike.body.position.y = Math.abs(Math.sin(G.t * 6)) * .03; bike.rider.position.y = 0; bike.rider.rotation.x = 0;
  bike.wheels.forEach(w => { w.rotation.x -= dt * 9 / .43; }); bike.flame.visible = false; bike.shield.visible = false; bike.magnet.visible = false;
  blob.position.set(.4, .03, z); blob.scale.setScalar(1); blob.visible = true;
  world.update(z, dt); G.fovT = 48;
  setCam(V(-2.6 + Math.sin(G.t * .25) * .4, 1.7, z + 4.6), V(.6, 1.05, z - 3), dt, 3);
}

    const rows = names.map((n, i) => ({ n, s: Math.round(12450 * Math.pow(.84, i)) })); rows.push({ n: save.name + ' (you)', s: save.best, me: true }); rows.sort((a, b) => b.s - a.s);
    openModal(`<h2 class="ptitle">RANKING</h2><div class="psub">Best distance · sample board</div><div class="list">${rows.map((r, i) => `<div class="li ${r.me ? 'me' : ''}"><div class="ic" style="font:6cqw var(--f-display);color:${i < 3 ? 'var(--red)' : 'var(--ink)'}">${i + 1}</div><div class="tx"><b>${r.n}</b></div><b style="font:5cqw var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums">${fmt(r.s)} M</b></div>`).join('')}</div>`);
  },
  settings() {
    openModal(`<h2 class="ptitle">SETTINGS</h2><div class="list">
      <div class="li"><div class="ic">${ICON.sound}</div><div class="tx"><b>Sound</b><span>Engine, coins and comic noises</span></div><button class="mini ${save.sound ? '' : 'gray'}" id="sSound">${save.sound ? 'ON' : 'OFF'}</button></div>
      <div class="li"><div class="ic">${ICON.gear}</div><div class="tx"><b>Graphics</b><span>Low draws fewer pixels for older phones</span></div><button class="mini b" id="sGfx">${save.quality.toUpperCase()}</button></div>
      <div class="li"><div class="ic">${ICON.helmet}</div><div class="tx"><b>Rider name</b><span>${save.name}</span></div><button class="mini b" id="sName">NEW</button></div>
      <div class="li"><div class="ic">${ICON.restart}</div><div class="tx"><b>Reset progress</b><span>Coins, bikes and records</span></div><button class="mini r" id="sReset">RESET</button></div></div>`);
    $('#sSound').onclick = () => { Snd.setOn(!save.sound); PANELS.settings(); };
    $('#sGfx').onclick = () => { save.quality = save.quality === 'high' ? 'low' : 'high'; persist(); applyQuality(); PANELS.settings(); };
    $('#sName').onclick = () => { save.name = pick(['Rider', 'Zoomer', 'Turbo', 'Bolt', 'Blaze']) + Math.floor(rand(100, 9999)); persist(); refreshWallet(); PANELS.settings(); };
    $('#sReset').onclick = function () { if (this.dataset.ok) { const keep = save.sound; Object.keys(save).forEach(k => delete save[k]); Object.assign(save, structuredClone(DEFAULT_SAVE), { sound: keep }); persist(); applySkin(bike, skinById(save.skin)); world.setTheme(theme()); refreshWallet(); closeModal(); toast('Fresh start!'); } else { this.dataset.ok = 1; this.textContent = 'SURE?'; } };
  },
  upgrade() { openGarage('upgrade'); },
  garage() { openGarage('bikes'); },
};
$$('[data-open]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); Snd.init(); Snd.click(); PANELS[b.dataset.open](); }));
$('#profileBtn').onclick = () => { Snd.init(); PANELS.settings(); };
$('#profileBtn').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); PANELS.settings(); } };
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && $('#mClose')) closeModal(); });

/* tracks */
const tgrid = $('#tgrid');
tgrid.innerHTML = THEMES.map((t, i) => `<button class="tcard" data-t="${i}"><div class="in"><div class="ph">INKING…</div><img alt="" hidden><span class="no">#${i + 1}</span><span class="stars">${'★'.repeat(t.stars)}</span></div>
  <div class="meta"><div class="tn">${t.name}</div><div class="ts">${t.place} · ${t.country}</div><div class="best"></div></div></button>`).join('');
$$('.tcard').forEach(c => c.onclick = () => { Snd.click(); openRaceStart(+c.dataset.t); });
function refreshTrackCards() { $$('.tcard').forEach(c => { const i = +c.dataset.t; c.classList.toggle('sel', i === save.track); const b = save.trackBest[i]; c.querySelector('.best').textContent = b ? 'BEST ' + fmt(b) + ' M' : 'NOT RIDDEN YET'; }); }
function openTracks() { showScreen('tracks'); refreshTrackCards(); refreshWallet(); G.state = 'tracks'; thumbQueue(); const sel = tgrid.querySelector('.sel'); if (sel) sel.scrollIntoView({ block: 'center' }); }
$('#trackChip').onclick = () => { Snd.init(); Snd.click(); openTracks(); };
$('#worldBtn').onclick = () => { Snd.init(); Snd.click(); openTracks(); };
function openRaceStart(i) {
  const t = THEMES[i];
  openModal(`<h2 class="ptitle">READY?</h2>
    <div class="rs-thumb"><img src="${thumbFor(i)}" alt="${t.place}"><div class="cap"><b>${t.name}</b><span>${t.place} · ${t.country}</span></div></div>
    <div class="kv"><span>Difficulty</span><b style="color:var(--red)">${'★'.repeat(t.stars)}<span style="opacity:.25">${'★'.repeat(5 - t.stars)}</span></b></div>
    <div class="kv"><span>Your best here</span><b>${save.trackBest[i] ? fmt(save.trackBest[i]) + ' m' : 'Not ridden yet'}</b></div>
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode ${k} ${k === save.mode ? 'on' : ''}" data-mode="${k}">${m.label}<small>COIN × ${m.coin.toFixed(1)}</small></button>`).join('')}</div>
    <button class="btn y" id="goBtn">${ICON.play} LET'S GO!</button>`);
  $$('[data-mode]').forEach(b => b.onclick = () => { Snd.click(); save.mode = b.dataset.mode; persist(); $$('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#goBtn').onclick = () => { closeModal(); if (save.track !== i) { save.track = i; persist(); world.setTheme(t); } startRun(); };
}

/* thumbnails rendered from each track's own scene */
let thumbR = null; const thumbCache = {};
function thumbFor(i) {
  if (thumbCache[i]) return thumbCache[i];
  if (!thumbR) { thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); thumbR.setSize(352, 242, false); }
  const t = THEMES[i], sc = new THREE.Scene(); const sm = makeSkyMat(); applySkyColors(sm, t); sm.uniforms.dotPx.value = 5; sc.add(new THREE.Mesh(new THREE.SphereGeometry(700, 24, 12), sm));
  sc.fog = new THREE.Fog(t.fog, 90, 520); sc.add(new THREE.HemisphereLight(t.hemi[0], t.hemi[1], t.hemiI ?? 1.3)); const s = new THREE.DirectionalLight(t.sun, t.sunI ?? 2.2); s.position.set(-30, 50, 20); sc.add(s);
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), toonMat(t.ground, { map: t.water ? world.waterTex : world.groundTex })); gr.rotation.x = -Math.PI / 2; gr.position.y = GY; sc.add(gr);
  const rd = new THREE.Group(); box(rd, 13, 1.6, 400, M('#3a3d48'), 0, -.8, -150); box(rd, .6, 1, 400, M('#ff3b30'), 6.6, .3, -150); box(rd, .6, 1, 400, M('#ff3b30'), -6.6, .3, -150); sc.add(toonize(rd));
  t.heroes.slice(0, 2).forEach((fn, k) => { const o = toonize(fn(t.night)); const b = new THREE.Box3().setFromObject(o); const dep = b.max.z - b.min.z; const side = k ? 1 : -1;
    if (o.userData.far) o.position.set(side * 160, GY, -300); else o.position.set(side * (12 + dep / 2 + 6), GY, k ? -190 : -85); o.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; sc.add(o); });
  const fl = t.fillers().map(f => toonize(f)); for (let k = 0; k < 8; k++) { const o = fl[k % fl.length].clone(); o.position.set((k % 2 ? 1 : -1) * rand(14, 40), GY, -20 - k * 22); sc.add(o); }
  const cam = new THREE.PerspectiveCamera(58, 352 / 242, .5, 1500); cam.position.set(4, 7, 26); cam.lookAt(-6, 12, -80);
  const prev = { res: outlineU.res.value.clone(), fc: outlineU.fogCol.value.clone(), fn: outlineU.fNear.value, ff: outlineU.fFar.value, th: outlineU.thick.value };
  outlineU.res.value.set(352, 242); outlineU.fogCol.value.set(t.fog); outlineU.fNear.value = 90; outlineU.fFar.value = 520; outlineU.thick.value = 1.4;
  thumbR.render(sc, cam);
  outlineU.res.value.copy(prev.res); outlineU.fogCol.value.copy(prev.fc); outlineU.fNear.value = prev.fn; outlineU.fFar.value = prev.ff; outlineU.thick.value = prev.th;
  const url = thumbR.domElement.toDataURL('image/jpeg', .85);
  sc.traverse(n => { if (n.isMesh) n.geometry.dispose(); }); sm.dispose();
  thumbCache[i] = url; return url;
}
let thumbBusy = false;
function thumbQueue() {
  if (thumbBusy) return; thumbBusy = true;
  const step = () => { if (G.state !== 'tracks') { thumbBusy = false; return; } const c = $$('.tcard').find(c2 => c2.querySelector('img').hidden); if (!c) { thumbBusy = false; return; }
    const img = c.querySelector('img'); img.src = thumbFor(+c.dataset.t); img.hidden = false; const ph = c.querySelector('.ph'); if (ph) ph.remove(); setTimeout(step, 30); };
  step();
}

/* garage */
let gIdx = 0, gTab = 'bikes';
function openGarage(tab = 'bikes') {
  gTab = tab; gIdx = SKINS.findIndex(s => s.id === save.skin); scene.remove(bike.root); gScene.add(bike.root); G.state = 'garage'; app.classList.add('garage-mode'); blob.visible = false;
  outlineU.fNear.value = 1e5 - 1; outlineU.fFar.value = 1e5; showScreen('garage'); renderGarage();
}
function closeGarage() { gScene.remove(bike.root); scene.add(bike.root); bike.root.rotation.y = 0; app.classList.remove('garage-mode'); applySkin(bike, skinById(save.skin)); outlineU.fNear.value = 50; outlineU.fFar.value = 330; goHome(); }
function renderGarage() {
  const s = SKINS[gIdx]; applySkin(bike, s); $('#gName').textContent = s.name.toUpperCase(); refreshWallet();
  $('#gStats').innerHTML = ['SPEED', 'HANDLING', 'BOOST'].map((l, i) => `<span>${l}</span><div class="sb"><i style="width:${s.stats[i]}%"></i></div><span class="v">${s.stats[i]}</span>`).join('');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === gTab));
  const act = $('#gAction');
  if (gTab === 'bikes') {
    $('#gBody').innerHTML = `<div class="skins">${SKINS.map((k, i) => `<button class="skin ${i === gIdx ? 'on' : ''}" data-s="${i}">${bikeSilhouette(k.body)}<b>${k.name}</b>${save.owned.includes(k.id) ? `<span class="own">${k.id === save.skin ? 'RIDING' : 'OWNED'}</span>` : `<span>${ICON.coin}${fmt(k.price)}</span>`}</button>`).join('')}</div>`;
    $$('[data-s]').forEach(b => b.onclick = () => { Snd.click(); gIdx = +b.dataset.s; renderGarage(); });
    act.hidden = false; act.className = 'btn'; act.disabled = false;
    if (s.id === save.skin) { act.textContent = 'RIDING THIS ONE'; act.disabled = true; }
    else if (save.owned.includes(s.id)) { act.textContent = 'RIDE IT!'; act.classList.add('g'); }
    else { act.textContent = `BUY · ${fmt(s.price)}`; act.classList.add('y'); act.disabled = save.coins < s.price; }
  } else {
    const ups = [['magnet', 'Magnet', 'Pulls coins in'], ['nitro', 'Nitro', 'Smash through traffic'], ['x2', 'Double', 'Double coins'], ['shield', 'Shield', 'Blocks one crash']];
    $('#gBody').innerHTML = `<div class="list upg">${ups.map(([k, n, d]) => { const lv = save.upg[k], cost = 400 * (lv + 1) ** 2;
      return `<div class="li" style="padding:1.6cqw 2.4cqw"><div class="ic">${ICON[PU[k].icon]}</div><div class="tx"><b>${n}</b><span>${d}${k !== 'shield' ? ' · ' + puDur(k).toFixed(1) + ' s' : ''}</span><div class="lv">${[0, 1, 2, 3, 4].map(j => `<i class="${j < lv ? 'on' : ''}"></i>`).join('')}</div></div>
      <button class="mini" data-u="${k}" ${lv >= 5 || save.coins < cost ? 'disabled' : ''}>${lv >= 5 ? 'MAX' : fmt(cost)}</button></div>`; }).join('')}</div>`;
    $$('[data-u]').forEach(b => b.onclick = () => { const k = b.dataset.u, cost = 400 * (save.upg[k] + 1) ** 2; if (save.coins < cost) return; save.coins -= cost; save.upg[k]++; persist(); Snd.cash(); pop('LEVEL UP!', { small: true }); renderGarage(); });
    act.hidden = true;
  }
}
$('#gAction').onclick = () => { const s = SKINS[gIdx]; if (save.owned.includes(s.id)) { save.skin = s.id; Snd.click(); } else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(s.id); save.skin = s.id; Snd.cash(); pop('NEW RIDE!'); } persist(); renderGarage(); };
$('#gPrev').onclick = () => { gIdx = (gIdx + SKINS.length - 1) % SKINS.length; gTab = 'bikes'; renderGarage(); };
$('#gNext').onclick = () => { gIdx = (gIdx + 1) % SKINS.length; gTab = 'bikes'; renderGarage(); };
$$('.tab').forEach(t => t.onclick = () => { Snd.click(); gTab = t.dataset.tab; renderGarage(); });
$$('[data-back]').forEach(b => b.onclick = () => { Snd.click(); if (G.state === 'garage') closeGarage(); else goHome(); });

function goHome() {
  Snd.engineStop(); clearRunObjects(); P = null; G.state = 'home'; showScreen('home'); refreshWallet();
  $('#count').hidden = true; $('#tut').hidden = true; $('#banner').classList.remove('show'); $('#speed').style.opacity = 0;
  bike.body.rotation.set(0, 0, 0); bike.body.position.set(0, 0, 0);
}
$('#playBtn').onclick = () => { Snd.init(); Snd.click(); openRaceStart(save.track); };
$('#pauseBtn').onclick = () => pauseGame();
function pauseGame() {
  if (G.state !== 'run') return; G.state = 'paused'; Snd.engineStop();
  openModal(`<h2 class="ptitle">PAUSED</h2><div class="btns"><button class="btn g" id="pResume">${ICON.play} RESUME</button><button class="btn" id="pRestart">${ICON.restart} RESTART</button>
    <button class="btn w" id="pSound">${ICON.sound} SOUND ${save.sound ? 'ON' : 'OFF'}</button><button class="btn r" id="pHome">${ICON.home} QUIT</button></div>`, false);
  $('#pResume').onclick = () => { closeModal(); G.state = 'run'; Snd.engineStart(); };
  $('#pRestart').onclick = () => { closeModal(); G.homeZ = P.z - 30; world.reset(G.homeZ); startRun(); };
  $('#pSound').onclick = () => { Snd.setOn(!save.sound); $('#pSound').innerHTML = `${ICON.sound} SOUND ${save.sound ? 'ON' : 'OFF'}`; };
  $('#pHome').onclick = () => { closeModal(); goHome(); };
}

/* input */
const keymap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ' ': 'up', ArrowDown: 'down', s: 'down', S: 'down' };
window.addEventListener('keydown', e => { if (keymap[e.key] && G.state === 'run') { e.preventDefault(); action(keymap[e.key]); } if ((e.key === 'Escape' || e.key === 'p') && G.state === 'run') pauseGame(); });
let sw = null;
app.addEventListener('pointerdown', e => { Snd.init(); if (G.state === 'run') sw = { x: e.clientX, y: e.clientY, done: false }; if (G.state === 'garage' && (e.target === canvas || e.target.id === 'garage')) { G.dragging = { x: e.clientX }; G.gVel = 0; } });
app.addEventListener('pointermove', e => {
  if (G.dragging) { const dx = e.clientX - G.dragging.x; G.gRot += dx * .012; G.gVel = dx * .6; G.dragging.x = e.clientX; }
  if (!sw || sw.done) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y, th = app.clientWidth * .055;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > th) { sw.done = true; action(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down')); }
});
window.addEventListener('pointerup', () => { sw = null; G.dragging = null; });
window.addEventListener('pointercancel', () => { sw = null; G.dragging = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* quality: fixed pixel-ratio caps + automatic step-down when frames run long */
function maxPR() { return Math.min(window.devicePixelRatio || 1, save.quality === 'high' ? 1.75 : 1); }
function applyQuality() { G.pr = maxPR(); resize(); }
function resize() {
  const w = app.clientWidth, h = app.clientHeight; if (!w || !h) return; renderer.setPixelRatio(G.pr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix(); outlineU.res.value.set(w, h); outlineU.thick.value = clamp(w / 190, 1.6, 3);
  world.skyMat.uniforms.dotPx.value = 6 * G.pr;
}
new ResizeObserver(resize).observe(app);
function adapt(dt) {
  if (G.state !== 'run') { G.ft.length = 0; return; }
  G.ft.push(dt); if (G.ft.length < 90) return;
  const avg = G.ft.reduce((a, b) => a + b, 0) / G.ft.length; G.ft.length = 0;
  if (avg > 1 / 45 && G.pr > 1) { G.pr = Math.max(1, G.pr - .25); resize(); }
}

/* =========================================================
   Loop
   ========================================================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; G.t += dt; adapt(dt);
  for (const p of parts) if (p.life > 0) { p.life -= dt; p.v.y -= 18 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = clamp(p.life * 2, 0, 1); if (p.life <= 0) p.m.visible = false; }
  if (G.state === 'home') updateHome(dt);
  else if (G.state === 'countdown') {
    G.count -= dt; const n = Math.ceil(G.count / .6);
    if (n !== G.lastCount) { G.lastCount = n; $('#count').innerHTML = `<b>${n > 0 ? n : 'GO!'}</b>`; if (n > 0) Snd.tone(520, .12, 'square', .08); else Snd.tone(1040, .25, 'square', .1); }
    bike.root.position.set(0, 0, P.z); bike.body.rotation.set(0, 0, 0); blob.position.set(0, .03, P.z); world.update(P.z, dt); bike.wheels.forEach(w => { w.rotation.x -= dt * 4; });
    G.fovT = 60; setCam(V(0, 3.15, P.z + 6.4), V(0, 1.25, P.z - 8), dt, 3);
    if (G.count <= -.35) { G.state = 'run'; $('#count').hidden = true; setTimeout(() => $('#banner').classList.remove('show'), 1200);
      if (!save.tutorial) setTimeout(() => { $('#tut').style.opacity = 0; setTimeout(() => { $('#tut').hidden = true; }, 500); save.tutorial = true; persist(); }, 3500); }
  }
  else if (G.state === 'run') updateRun(dt);
  if (G.state === 'garage') { updateGarage(dt); renderer.render(gScene, camera); }
  else if (G.state !== 'tracks') renderer.render(scene, camera); /* the track list is a static screen, so the GPU rests */
}

/* boot */
async function boot() {
  const bar = $('#loadbar'), txt = $('#loadtxt');
  bar.style.width = '30%'; await new Promise(r => setTimeout(r, 40));
  world.setTheme(theme()); bar.style.width = '70%'; txt.textContent = 'REVVING ENGINE...';
  G.homeZ = 0; world.reset(0); applyQuality();
  bar.style.width = '100%'; await new Promise(r => setTimeout(r, 250));
  camera.position.set(-2.6, 1.7, 4.6); G.state = 'home'; $('#loading').hidden = true; showScreen('home'); refreshWallet();
  requestAnimationFrame(frame);
}
boot();
</script>
